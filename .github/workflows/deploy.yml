name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "environment/**"
      - "scripts/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/**"
      - "environment/**"
      - "scripts/**"
      - ".github/workflows/deploy.yml"
  schedule:
    # 每天 03:17 UTC 重建全部期望状态，纠正人工改动造成的漂移
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      app:
        description: "只部署指定单元：<名字>（在 apps/ 与 environment/ 中查找）或 <scope>/<名字>；留空表示全部"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: 解析待部署单元
    runs-on: ubuntu-latest
    outputs:
      items: ${{ steps.detect.outputs.items }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 计算部署单元列表
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          # workflow_dispatch 的 app 输入；留空=全部
          REQUESTED: ${{ github.event.inputs.app }}
          # 增量基线与终点：PR 用 base/head，push 用 before/sha
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        # 解析逻辑在 scripts/resolve-units.sh：本地可复现（见该脚本头部注释），
        # 并在这里完成 hosts.yaml、DEPLOY_MODE/DEPLOY_TARGET 的一致性校验
        run: bash scripts/resolve-units.sh

  validate:
    name: 校验 ${{ matrix.item.scope }}/${{ matrix.item.name }}
    needs: resolve
    if: needs.resolve.outputs.items != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJSON(needs.resolve.outputs.items) }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 校验单元定义
        run: |
          set -euo pipefail
          dir="${{ matrix.item.scope }}/${{ matrix.item.name }}"
          mode="${{ matrix.item.mode }}"

          # 镜像源守卫：registry 按主机不同（旧主机 ghcr.chenby.cn，cloud3 只能 ghcr.io）。
          # 谁把 *_IMAGE 的 registry 换回旧值，这里就红，不拖到部署时才发现拉不动镜像。
          bash scripts/check-registries.sh "${dir}" "${{ matrix.item.target }}"

          case "${mode}" in
            native)
              # native 单元非容器交付：校验部署脚本语法与期望状态文件齐备
              test -f "${dir}/.env"
              test -f "${dir}/app.conf"
              test -d "${dir}/conf"
              bash -n "${dir}/native/deploy-native.sh"
              echo "native 单元 ${dir} 校验通过"
              ;;
            k8s)
              # k8s 单元：渲染即校验——未定义变量、残留 ${...}、缺 apiVersion/kind 都会失败
              python3 scripts/render-k8s.py "${dir}" > /dev/null
              echo "k8s 单元 ${dir} 渲染校验通过"
              ;;
            compose)
              docker compose \
                --project-directory "${dir}" \
                -f "${dir}/compose.yaml" \
                config --quiet
              ;;
            *)
              echo "未知 DEPLOY_MODE=${mode}" >&2
              exit 1
              ;;
          esac

  deploy:
    name: 部署 ${{ matrix.item.scope }}/${{ matrix.item.name }}
    needs:
      - resolve
      - validate
    # PR 只校验不部署；部署仅发生在合入 main、定时任务或手动触发时
    if: needs.resolve.outputs.items != '[]' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        item: ${{ fromJSON(needs.resolve.outputs.items) }}
    env:
      # GitHub 不支持按变量名动态读 secret，因此**所有**主机的凭据都要在这里静态映射；
      # 具体用哪一组由 matrix.item.target 经 scripts/hosts.sh 决定（见「解析目标主机」步骤）。
      # 新增主机时：在 hosts.yaml 登记 + 在此追加映射，两处名字必须一致。
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      CLOUD3_DEPLOY_HOST: ${{ secrets.CLOUD3_DEPLOY_HOST }}
      CLOUD3_DEPLOY_USER: ${{ secrets.CLOUD3_DEPLOY_USER }}
      CLOUD3_DEPLOY_SSH_KEY: ${{ secrets.CLOUD3_DEPLOY_SSH_KEY }}
      CLOUD3_DEPLOY_PORT: ${{ secrets.CLOUD3_DEPLOY_PORT }}
      CLOUD3_DEPLOY_KNOWN_HOSTS: ${{ secrets.CLOUD3_DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 解析目标主机并准备 SSH 凭据
        run: |
          set -euo pipefail
          target="${{ matrix.item.target }}"

          # Secret 的名字登记在 hosts.yaml，值在 job env 里静态映射（GitHub 不支持按名动态读 secret）。
          # 这一步按 target 查出名字，再用 ${!name} 间接取值。
          #
          # 注意：不要依赖 set -e 拦住这里的失败——bash 在嵌套命令替换里对 errexit
          # 的行为不可靠（实测漏网，随后在 ${!var} 上报 "无效的变量名"）。所有调用点
          # 都显式 `|| exit 1`。
          secret_name() {
            local name
            name="$(bash scripts/hosts.sh "${target}" secret "$1" 2>/dev/null || true)"
            if [ -z "${name}" ]; then
              echo "hosts.yaml 里查不到主机 ${target} 的 ${1}（主机名写错或登记缺字段）" >&2
              bash scripts/hosts.sh check >&2 || true
              return 1
            fi
            printf '%s' "${name}"
          }

          # 必填凭据：Secret 名字查不到、或值为空，都失败并点名
          resolve() {
            local key="$1" var
            var="$(secret_name "${key}")" || return 1
            if [ -z "${!var:-}" ]; then
              echo "缺少 GitHub Actions secret: ${var}（主机 ${target} 的 ${key}）" >&2
              echo "按 hosts.yaml 的登记补齐 Secret，再重跑。" >&2
              return 1
            fi
            printf '%s' "${!var}"
          }

          host="$(resolve host)" || exit 1
          user="$(resolve user)" || exit 1

          # 端口可选：与旧行为一致，缺省 22（现有 default 主机就没有这个 secret）
          port_var="$(secret_name port)" || exit 1
          port="${!port_var:-22}"

          # 私钥只在文件里落地，不写进 GITHUB_ENV：含换行，写进 env 文件会破坏格式
          key="$(resolve key)" || exit 1
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${key}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # 私钥格式错或带口令时在此立即失败，不要拖到 ssh 报 Permission denied
          ssh-keygen -y -P '' -f ~/.ssh/id_rsa >/dev/null
          ssh-keygen -l -f ~/.ssh/id_rsa

          # 主机密钥可选：有 secret 就用固定的，没有才 ssh-keyscan（与旧行为一致）
          known_hosts_var="$(secret_name known_hosts)" || exit 1
          known_hosts="${!known_hosts_var:-}"
          if [ -n "${known_hosts}" ]; then
            printf '%s\n' "${known_hosts}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${port}" -H "${host}" > ~/.ssh/known_hosts 2>/dev/null
            echo "已用 ssh-keyscan 获取主机密钥；建议把 ${host} 的公钥写进 secret ${known_hosts_var}"
          fi
          chmod 600 ~/.ssh/known_hosts

          {
            echo "DEPLOY_HOST=${host}"
            echo "DEPLOY_USER=${user}"
            echo "DEPLOY_PORT=${port}"
          } >> "${GITHUB_ENV}"

          echo "目标主机: ${target}（${user}@${host}:${port}）"

      - name: 渲染 k8s 期望状态
        if: matrix.item.mode == 'k8s'
        run: |
          set -euo pipefail
          dir="${{ matrix.item.scope }}/${{ matrix.item.name }}"
          # 渲染放 runner 侧：目标主机不需要 python/gettext，渲染错误也不会拖到集群里才发现
          python3 scripts/render-k8s.py "${dir}" > "${dir}/rendered.yaml"
          echo "已渲染 ${dir}/rendered.yaml（$(grep -c '^kind:' "${dir}/rendered.yaml") 个资源）"

      - name: 同步期望状态文件到云主机
        run: |
          set -euo pipefail
          unit="${{ matrix.item.scope }}/${{ matrix.item.name }}"
          remote_dir="/opt/cops/${unit}"
          ssh -p "${DEPLOY_PORT}" \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "mkdir -p '${remote_dir}' /opt/cops/secrets"
          tar cz -C "${unit}" . \
            | ssh -p "${DEPLOY_PORT}" -o StrictHostKeyChecking=yes \
                "${DEPLOY_USER}@${DEPLOY_HOST}" "tar xz -C '${remote_dir}'"

      - name: 下发运行期密钥
        env:
          # GitHub Actions 不支持按变量名动态读取 secret，新增部署单元的运行期密钥时
          # 在此追加一行，并在对应 app.conf 的 SECRET_ENV 中声明变量名
          PTDOC_DATA_KEY: ${{ secrets.PTDOC_DATA_KEY }}
          # vectorman 已迁到 k8s（cloud3）：不再需要 sudo 密码
          # lems 七牛云 AK/SK（其余 QINIU_* 为明文，放 apps/lems/.env）
          QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
          QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
        run: |
          set -euo pipefail
          unit="${{ matrix.item.scope }}/${{ matrix.item.name }}"
          name="${{ matrix.item.name }}"
          conf="${unit}/app.conf"

          secret_keys=""
          if [ -f "${conf}" ]; then
            # shellcheck disable=SC1090
            . "${conf}"
            secret_keys="${SECRET_ENV:-}"
          fi

          if [ -z "${secret_keys}" ]; then
            echo "部署单元 ${unit} 未声明 SECRET_ENV，跳过分发"
            exit 0
          fi

          # 只检查变量是否存在，不打印任何取值
          payload=""
          missing=""
          for key in ${secret_keys}; do
            value="${!key:-}"
            if [ -z "${value}" ]; then
              missing="${missing} ${key}"
              continue
            fi
            payload="${payload}${key}=${value}"$'\n'
          done

          if [ -n "${missing}" ]; then
            echo "缺少 GitHub Actions secret:${missing}" >&2
            exit 1
          fi

          # 通过 stdin 传输，密钥不出现在命令行、不落盘到 runner
          remote_file="/opt/cops/secrets/${name}.env"
          printf '%s' "${payload}" \
            | ssh -p "${DEPLOY_PORT}" -o StrictHostKeyChecking=yes \
                "${DEPLOY_USER}@${DEPLOY_HOST}" \
                "umask 077; mkdir -p /opt/cops/secrets; cat > '${remote_file}'; chmod 600 '${remote_file}'"

          echo "已下发 ${unit} 运行期密钥（$(printf '%s' "${secret_keys}" | wc -w) 个变量）"

      - name: 暂存 native 单元产物
        run: |
          set -euo pipefail
          dir="${{ matrix.item.scope }}/${{ matrix.item.name }}"

          mode="compose"
          if [ -f "${dir}/app.conf" ]; then
            mode="$(sed -n 's/^DEPLOY_MODE=//p' "${dir}/app.conf" | tail -1)"
            mode="${mode:-compose}"
          fi
          if [ "${mode}" != "native" ] || [ ! -f "${dir}/.env" ]; then
            echo "单元 ${dir} 非 native，跳过产物暂存"
            exit 0
          fi

          # shellcheck disable=SC1090
          set -a; . "${dir}/.env"; set +a
          if [ -z "${NATIVE_ARTIFACT_URL:-}" ]; then
            echo "单元 ${dir} 未声明 NATIVE_ARTIFACT_URL，跳过产物暂存"
            exit 0
          fi

          name="${NATIVE_ARTIFACT_URL##*/}"
          name="${name%%\?*}"
          tmp="${RUNNER_TEMP}/${name}"
          # 在 runner 侧下载并校验：云主机直连 GitHub 不可靠
          curl -fSL --retry 3 --connect-timeout 20 -o "${tmp}" "${NATIVE_ARTIFACT_URL}"
          printf '%s  %s\n' "${NATIVE_ARTIFACT_SHA256}" "${tmp}" | sha256sum -c -

          remote_file="/opt/cops/cache/${{ matrix.item.name }}/${name}"
          ssh -p "${DEPLOY_PORT}" -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "umask 077; mkdir -p '/opt/cops/cache/${{ matrix.item.name }}'; cat > '${remote_file}'" < "${tmp}"
          echo "已暂存产物 ${name} 到云主机 ${remote_file}"

      - name: 执行部署
        run: |
          set -euo pipefail
          # k8s 模式走 scripts/deploy-k8s.sh（apply + rollout + 探活），其余走 scripts/deploy.sh
          case "${{ matrix.item.mode }}" in
            k8s) host_script="scripts/deploy-k8s.sh" ;;
            *) host_script="scripts/deploy.sh" ;;
          esac
          ssh -p "${DEPLOY_PORT}" -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "bash -s -- '${{ matrix.item.name }}' '${{ matrix.item.scope }}'" \
            < "${host_script}"
