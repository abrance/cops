name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "scripts/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/**"
      - "scripts/**"
      - ".github/workflows/deploy.yml"
  schedule:
    # 每天 03:17 UTC 重建全部期望状态，纠正人工改动造成的漂移
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      app:
        description: "只部署指定应用（apps/ 下的目录名）；留空表示全部"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: 解析待部署应用
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.detect.outputs.apps }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 计算应用列表
        id: detect
        run: |
          set -euo pipefail
          requested="${{ github.event.inputs.app }}"
          event="${{ github.event_name }}"
          if [ -n "${requested}" ]; then
            # 手动指定应用
            candidates="${requested}"
          elif [ "${event}" = "schedule" ] || [ "${event}" = "workflow_dispatch" ]; then
            # 定时任务或未指定应用的手动触发：部署全部
            candidates="$(ls apps)"
          else
            # push 与 pull_request：按变更文件计算受影响应用
            if [ "${event}" = "pull_request" ]; then
              base="${{ github.event.pull_request.base.sha }}"
              head="${{ github.event.pull_request.head.sha }}"
            else
              base="${{ github.event.before }}"
              head="${{ github.sha }}"
            fi
            if [ -z "${base}" ] \
              || [ "${base}" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              # 首次推送或基线不可用：无法计算增量，保守地部署全部
              candidates="$(ls apps)"
            else
              changed="$(git diff --name-only "${base}" "${head}")"
              if grep -Eq '^(scripts/|\.github/workflows/deploy\.yml$)' <<<"${changed}"; then
                # 部署逻辑自身变更：全量部署以应用新逻辑
                candidates="$(ls apps)"
              elif grep -Eq '^apps/' <<<"${changed}"; then
                candidates="$(grep -E '^apps/' <<<"${changed}" | cut -d/ -f2 | sort -u | tr '\n' ' ')"
              else
                # 变更不涉及任何应用：无需部署
                candidates=""
              fi
            fi
          fi

          apps="[]"
          for app in ${candidates}; do
            if ! printf '%s' "${app}" | grep -Eq '^[a-z0-9][a-z0-9-]*$'; then
              echo "忽略非法应用名: ${app}" >&2
              continue
            fi
            mode="compose"
            if [ -f "apps/${app}/app.conf" ]; then
              mode="$(sed -n 's/^DEPLOY_MODE=//p' "apps/${app}/app.conf" | tail -1)"
              mode="${mode:-compose}"
            fi
            case "${mode}" in
              compose)
                if [ ! -f "apps/${app}/compose.yaml" ]; then
                  echo "忽略缺少 compose.yaml 的 compose 应用: ${app}" >&2
                  continue
                fi
                ;;
              native)
                if [ ! -f "apps/${app}/native/deploy-native.sh" ]; then
                  echo "忽略缺少 native/deploy-native.sh 的 native 应用: ${app}" >&2
                  continue
                fi
                ;;
              *)
                echo "忽略未知 DEPLOY_MODE=${mode} 的应用: ${app}" >&2
                continue
                ;;
            esac
            apps="$(jq -c --arg a "${app}" '. + [$a]' <<<"${apps}")"
          done

          echo "待部署应用: ${apps}"
          echo "apps=${apps}" >> "${GITHUB_OUTPUT}"

  validate:
    name: 校验 ${{ matrix.app }}
    needs: resolve
    if: needs.resolve.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.resolve.outputs.apps) }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 校验编排文件
        run: |
          set -euo pipefail
          app="apps/${{ matrix.app }}"
          mode="compose"
          if [ -f "${app}/app.conf" ]; then
            mode="$(sed -n 's/^DEPLOY_MODE=//p' "${app}/app.conf" | tail -1)"
            mode="${mode:-compose}"
          fi
          if [ "${mode}" = "native" ]; then
            # native 应用非容器交付：校验部署脚本语法与期望状态文件齐备
            test -f "${app}/.env"
            test -f "${app}/app.conf"
            test -d "${app}/conf"
            bash -n "${app}/native/deploy-native.sh"
            echo "native 应用 ${app} 校验通过"
          else
            docker compose \
              --project-directory "${app}" \
              -f "${app}/compose.yaml" \
              config --quiet
          fi

  deploy:
    name: 部署 ${{ matrix.app }}
    needs:
      - resolve
      - validate
    # PR 只校验不部署；部署仅发生在合入 main、定时任务或手动触发时
    if: needs.resolve.outputs.apps != '[]' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        app: ${{ fromJSON(needs.resolve.outputs.apps) }}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 校验部署凭据
        run: |
          set -euo pipefail
          missing=""
          for name in DEPLOY_HOST DEPLOY_USER SSHPASS; do
            if [ -z "${!name:-}" ]; then
              missing="${missing} ${name}"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "缺少 GitHub Actions secret:${missing}" >&2
            exit 1
          fi
          port="${{ secrets.DEPLOY_PORT }}"
          echo "DEPLOY_PORT=${port:-22}" >> "${GITHUB_ENV}"

      - name: 安装 sshpass
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: 配置 SSH 主机密钥
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "${{ secrets.DEPLOY_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${DEPLOY_PORT}" -H "${DEPLOY_HOST}" > ~/.ssh/known_hosts 2>/dev/null
            echo "已用 ssh-keyscan 获取主机密钥；建议改用 DEPLOY_KNOWN_HOSTS 固定指纹"
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: 同步应用文件到云主机
        run: |
          set -euo pipefail
          remote_dir="/opt/cops/apps/${{ matrix.app }}"
          sshpass -e ssh -p "${DEPLOY_PORT}" \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "mkdir -p '${remote_dir}' /opt/cops/secrets"
          tar cz -C "apps/${{ matrix.app }}" . \
            | sshpass -e ssh -p "${DEPLOY_PORT}" -o StrictHostKeyChecking=yes \
                "${DEPLOY_USER}@${DEPLOY_HOST}" "tar xz -C '${remote_dir}'"

      - name: 下发运行期密钥
        env:
          # GitHub Actions 不支持按变量名动态读取 secret，新增应用的运行期密钥时
          # 在此追加一行，并在对应 apps/<app>/app.conf 的 SECRET_ENV 中声明变量名
          PTDOC_DATA_KEY: ${{ secrets.PTDOC_DATA_KEY }}
          # vectorman 为 native 部署：sudo 密码与 SSH 密码相同，复用 DEPLOY_PASSWORD
          VECTORMAN_SUDO_PASS: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          set -euo pipefail
          app="${{ matrix.app }}"
          conf="apps/${app}/app.conf"

          secret_keys=""
          if [ -f "${conf}" ]; then
            # shellcheck disable=SC1090
            . "${conf}"
            secret_keys="${SECRET_ENV:-}"
          fi

          if [ -z "${secret_keys}" ]; then
            echo "应用 ${app} 未声明 SECRET_ENV，跳过分发"
            exit 0
          fi

          # 只检查变量是否存在，不打印任何取值
          payload=""
          missing=""
          for key in ${secret_keys}; do
            value="${!key:-}"
            if [ -z "${value}" ]; then
              missing="${missing} ${key}"
              continue
            fi
            payload="${payload}${key}=${value}"$'\n'
          done

          if [ -n "${missing}" ]; then
            echo "缺少 GitHub Actions secret:${missing}" >&2
            exit 1
          fi

          # 通过 stdin 传输，密钥不出现在命令行、不落盘到 runner
          remote_file="/opt/cops/secrets/${app}.env"
          printf '%s' "${payload}" \
            | sshpass -e ssh -p "${DEPLOY_PORT}" -o StrictHostKeyChecking=yes \
                "${DEPLOY_USER}@${DEPLOY_HOST}" \
                "umask 077; mkdir -p /opt/cops/secrets; cat > '${remote_file}'; chmod 600 '${remote_file}'"

          echo "已下发 ${app} 运行期密钥（$(printf '%s' "${secret_keys}" | wc -w) 个变量）"

      - name: 暂存 native 应用产物
        run: |
          set -euo pipefail
          app="${{ matrix.app }}"
          dir="apps/${app}"

          mode="compose"
          if [ -f "${dir}/app.conf" ]; then
            mode="$(sed -n 's/^DEPLOY_MODE=//p' "${dir}/app.conf" | tail -1)"
            mode="${mode:-compose}"
          fi
          if [ "${mode}" != "native" ] || [ ! -f "${dir}/.env" ]; then
            echo "应用 ${app} 非 native，跳过产物暂存"
            exit 0
          fi

          # shellcheck disable=SC1090
          set -a; . "${dir}/.env"; set +a
          if [ -z "${NATIVE_ARTIFACT_URL:-}" ]; then
            echo "应用 ${app} 未声明 NATIVE_ARTIFACT_URL，跳过产物暂存"
            exit 0
          fi

          name="${NATIVE_ARTIFACT_URL##*/}"
          name="${name%%\?*}"
          tmp="${RUNNER_TEMP}/${name}"
          # 在 runner 侧下载并校验：云主机直连 GitHub 不可靠
          curl -fSL --retry 3 --connect-timeout 20 -o "${tmp}" "${NATIVE_ARTIFACT_URL}"
          printf '%s  %s\n' "${NATIVE_ARTIFACT_SHA256}" "${tmp}" | sha256sum -c -

          remote_file="/opt/cops/cache/${app}/${name}"
          sshpass -e ssh -p "${DEPLOY_PORT}" -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "umask 077; mkdir -p '/opt/cops/cache/${app}'; cat > '${remote_file}'" < "${tmp}"
          echo "已暂存产物 ${name} 到云主机 ${remote_file}"

      - name: 执行部署
        run: |
          set -euo pipefail
          sshpass -e ssh -p "${DEPLOY_PORT}" -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "bash -s -- '${{ matrix.app }}'" \
            < scripts/deploy.sh
