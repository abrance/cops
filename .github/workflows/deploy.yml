name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "environment/**"
      - "scripts/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/**"
      - "environment/**"
      - "scripts/**"
      - ".github/workflows/deploy.yml"
  schedule:
    # 每天 03:17 UTC 重建全部期望状态，纠正人工改动造成的漂移
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      app:
        description: "只部署指定单元：<名字>（在 apps/ 与 environment/ 中查找）或 <scope>/<名字>；留空表示全部"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: 解析待部署单元
    runs-on: ubuntu-latest
    outputs:
      items: ${{ steps.detect.outputs.items }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 计算部署单元列表
        id: detect
        run: |
          set -euo pipefail

          # 部署单元有两种范围：
          #   apps/<名字>         应用
          #   environment/<名字>  应用依赖的环境组件（中间件等）
          list_all() {
            for scope in apps environment; do
              [ -d "${scope}" ] || continue
              for name in $(ls "${scope}"); do
                [ -d "${scope}/${name}" ] && echo "${scope}/${name}"
              done
            done
          }

          requested="${{ github.event.inputs.app }}"
          event="${{ github.event_name }}"
          if [ -n "${requested}" ]; then
            # 手动指定：支持 <scope>/<名字>，也支持只写名字（在两个范围里查找）
            case "${requested}" in
              */*)
                candidates="${requested}"
                ;;
              *)
                candidates=""
                for scope in apps environment; do
                  if [ -d "${scope}/${requested}" ]; then
                    candidates="${candidates} ${scope}/${requested}"
                  fi
                done
                if [ -z "${candidates}" ]; then
                  echo "找不到部署单元 ${requested}：apps/ 与 environment/ 下都没有这个目录" >&2
                  exit 1
                fi
                ;;
            esac
          elif [ "${event}" = "schedule" ] || [ "${event}" = "workflow_dispatch" ]; then
            # 定时任务或未指定单元的手动触发：部署全部
            candidates="$(list_all)"
          else
            # push 与 pull_request：按变更文件计算受影响单元
            if [ "${event}" = "pull_request" ]; then
              base="${{ github.event.pull_request.base.sha }}"
              head="${{ github.event.pull_request.head.sha }}"
            else
              base="${{ github.event.before }}"
              head="${{ github.sha }}"
            fi
            if [ -z "${base}" ] \
              || [ "${base}" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              # 首次推送或基线不可用：无法计算增量，保守地部署全部
              candidates="$(list_all)"
            else
              changed="$(git diff --name-only "${base}" "${head}")"
              if grep -Eq '^(scripts/|\.github/workflows/deploy\.yml$)' <<<"${changed}"; then
                # 部署逻辑自身变更：全量部署以应用新逻辑
                candidates="$(list_all)"
              elif grep -Eq '^(apps|environment)/' <<<"${changed}"; then
                candidates="$(grep -E '^(apps|environment)/' <<<"${changed}" | awk -F/ '{print $1"/"$2}' | sort -u)"
              else
                # 变更不涉及任何部署单元：无需部署
                candidates=""
              fi
            fi
          fi

          items="[]"
          seen=""
          for candidate in ${candidates}; do
            scope="${candidate%%/*}"
            name="${candidate#*/}"
            case "${scope}" in
              apps | environment) ;;
              *)
                echo "忽略未知范围: ${candidate}" >&2
                continue
                ;;
            esac
            if ! printf '%s' "${name}" | grep -Eq '^[a-z0-9][a-z0-9-]*$'; then
              echo "忽略非法名字: ${candidate}" >&2
              continue
            fi
            # 名字在两个范围之间必须唯一：密钥文件与容器名都按名字定位
            if printf ' %s ' "${seen}" | grep -q " ${name} "; then
              echo "名字在 apps/ 与 environment/ 之间冲突: ${name}" >&2
              exit 1
            fi
            seen="${seen} ${name}"
            mode="compose"
            if [ -f "${candidate}/app.conf" ]; then
              mode="$(sed -n 's/^DEPLOY_MODE=//p' "${candidate}/app.conf" | tail -1)"
              mode="${mode:-compose}"
            fi
            case "${mode}" in
              compose)
                if [ ! -f "${candidate}/compose.yaml" ]; then
                  echo "忽略缺少 compose.yaml 的 compose 单元: ${candidate}" >&2
                  continue
                fi
                ;;
              native)
                if [ ! -f "${candidate}/native/deploy-native.sh" ]; then
                  echo "忽略缺少 native/deploy-native.sh 的 native 单元: ${candidate}" >&2
                  continue
                fi
                ;;
              *)
                echo "忽略未知 DEPLOY_MODE=${mode} 的单元: ${candidate}" >&2
                continue
                ;;
            esac
            items="$(jq -c --arg s "${scope}" --arg n "${name}" '. + [{scope:$s,name:$n}]' <<<"${items}")"
          done

          echo "待部署单元: ${items}"
          echo "items=${items}" >> "${GITHUB_OUTPUT}"

  validate:
    name: 校验 ${{ matrix.item.scope }}/${{ matrix.item.name }}
    needs: resolve
    if: needs.resolve.outputs.items != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJSON(needs.resolve.outputs.items) }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 校验编排文件
        run: |
          set -euo pipefail
          dir="${{ matrix.item.scope }}/${{ matrix.item.name }}"
          mode="compose"
          if [ -f "${dir}/app.conf" ]; then
            mode="$(sed -n 's/^DEPLOY_MODE=//p' "${dir}/app.conf" | tail -1)"
            mode="${mode:-compose}"
          fi
          if [ "${mode}" = "native" ]; then
            # native 单元非容器交付：校验部署脚本语法与期望状态文件齐备
            test -f "${dir}/.env"
            test -f "${dir}/app.conf"
            test -d "${dir}/conf"
            bash -n "${dir}/native/deploy-native.sh"
            echo "native 单元 ${dir} 校验通过"
          else
            docker compose \
              --project-directory "${dir}" \
              -f "${dir}/compose.yaml" \
              config --quiet
          fi

  deploy:
    name: 部署 ${{ matrix.item.scope }}/${{ matrix.item.name }}
    needs:
      - resolve
      - validate
    # PR 只校验不部署；部署仅发生在合入 main、定时任务或手动触发时
    if: needs.resolve.outputs.items != '[]' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        item: ${{ fromJSON(needs.resolve.outputs.items) }}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      # 校验步骤用 ${!name} 间接取值，所以私钥必须在 job env 里映射，不能只写在单个 step 的 env
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 校验部署凭据
        run: |
          set -euo pipefail
          missing=""
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            if [ -z "${!name:-}" ]; then
              missing="${missing} ${name}"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "缺少 GitHub Actions secret:${missing}" >&2
            exit 1
          fi
          port="${{ secrets.DEPLOY_PORT }}"
          echo "DEPLOY_PORT=${port:-22}" >> "${GITHUB_ENV}"

      - name: 写入部署私钥
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # 写入 runner 默认私钥路径：只有这一把身份，后续 ssh 无需再传 -i
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # 私钥格式错或带口令时在此立即失败，不要拖到 ssh 报 Permission denied
          ssh-keygen -y -P '' -f ~/.ssh/id_rsa >/dev/null
          ssh-keygen -l -f ~/.ssh/id_rsa

      - name: 配置 SSH 主机密钥
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "${{ secrets.DEPLOY_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${DEPLOY_PORT}" -H "${DEPLOY_HOST}" > ~/.ssh/known_hosts 2>/dev/null
            echo "已用 ssh-keyscan 获取主机密钥；建议改用 DEPLOY_KNOWN_HOSTS 固定指纹"
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: 同步期望状态文件到云主机
        run: |
          set -euo pipefail
          unit="${{ matrix.item.scope }}/${{ matrix.item.name }}"
          remote_dir="/opt/cops/${unit}"
          ssh -p "${DEPLOY_PORT}" \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "mkdir -p '${remote_dir}' /opt/cops/secrets"
          tar cz -C "${unit}" . \
            | ssh -p "${DEPLOY_PORT}" -o StrictHostKeyChecking=yes \
                "${DEPLOY_USER}@${DEPLOY_HOST}" "tar xz -C '${remote_dir}'"

      - name: 下发运行期密钥
        env:
          # GitHub Actions 不支持按变量名动态读取 secret，新增部署单元的运行期密钥时
          # 在此追加一行，并在对应 app.conf 的 SECRET_ENV 中声明变量名
          PTDOC_DATA_KEY: ${{ secrets.PTDOC_DATA_KEY }}
          # vectorman 为 native 部署：SSH 走密钥，DEPLOY_PASSWORD 仅作为 sudo 密码复用
          VECTORMAN_SUDO_PASS: ${{ secrets.DEPLOY_PASSWORD }}
          # lems 七牛云 AK/SK（其余 QINIU_* 为明文，放 apps/lems/.env）
          QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
          QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
        run: |
          set -euo pipefail
          unit="${{ matrix.item.scope }}/${{ matrix.item.name }}"
          name="${{ matrix.item.name }}"
          conf="${unit}/app.conf"

          secret_keys=""
          if [ -f "${conf}" ]; then
            # shellcheck disable=SC1090
            . "${conf}"
            secret_keys="${SECRET_ENV:-}"
          fi

          if [ -z "${secret_keys}" ]; then
            echo "部署单元 ${unit} 未声明 SECRET_ENV，跳过分发"
            exit 0
          fi

          # 只检查变量是否存在，不打印任何取值
          payload=""
          missing=""
          for key in ${secret_keys}; do
            value="${!key:-}"
            if [ -z "${value}" ]; then
              missing="${missing} ${key}"
              continue
            fi
            payload="${payload}${key}=${value}"$'\n'
          done

          if [ -n "${missing}" ]; then
            echo "缺少 GitHub Actions secret:${missing}" >&2
            exit 1
          fi

          # 通过 stdin 传输，密钥不出现在命令行、不落盘到 runner
          remote_file="/opt/cops/secrets/${name}.env"
          printf '%s' "${payload}" \
            | ssh -p "${DEPLOY_PORT}" -o StrictHostKeyChecking=yes \
                "${DEPLOY_USER}@${DEPLOY_HOST}" \
                "umask 077; mkdir -p /opt/cops/secrets; cat > '${remote_file}'; chmod 600 '${remote_file}'"

          echo "已下发 ${unit} 运行期密钥（$(printf '%s' "${secret_keys}" | wc -w) 个变量）"

      - name: 暂存 native 单元产物
        run: |
          set -euo pipefail
          dir="${{ matrix.item.scope }}/${{ matrix.item.name }}"

          mode="compose"
          if [ -f "${dir}/app.conf" ]; then
            mode="$(sed -n 's/^DEPLOY_MODE=//p' "${dir}/app.conf" | tail -1)"
            mode="${mode:-compose}"
          fi
          if [ "${mode}" != "native" ] || [ ! -f "${dir}/.env" ]; then
            echo "单元 ${dir} 非 native，跳过产物暂存"
            exit 0
          fi

          # shellcheck disable=SC1090
          set -a; . "${dir}/.env"; set +a
          if [ -z "${NATIVE_ARTIFACT_URL:-}" ]; then
            echo "单元 ${dir} 未声明 NATIVE_ARTIFACT_URL，跳过产物暂存"
            exit 0
          fi

          name="${NATIVE_ARTIFACT_URL##*/}"
          name="${name%%\?*}"
          tmp="${RUNNER_TEMP}/${name}"
          # 在 runner 侧下载并校验：云主机直连 GitHub 不可靠
          curl -fSL --retry 3 --connect-timeout 20 -o "${tmp}" "${NATIVE_ARTIFACT_URL}"
          printf '%s  %s\n' "${NATIVE_ARTIFACT_SHA256}" "${tmp}" | sha256sum -c -

          remote_file="/opt/cops/cache/${{ matrix.item.name }}/${name}"
          ssh -p "${DEPLOY_PORT}" -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "umask 077; mkdir -p '/opt/cops/cache/${{ matrix.item.name }}'; cat > '${remote_file}'" < "${tmp}"
          echo "已暂存产物 ${name} 到云主机 ${remote_file}"

      - name: 执行部署
        run: |
          set -euo pipefail
          ssh -p "${DEPLOY_PORT}" -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "bash -s -- '${{ matrix.item.name }}' '${{ matrix.item.scope }}'" \
            < scripts/deploy.sh
