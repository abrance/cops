# litellm 骨架配置（随仓库走，只读挂载到容器 /app/config.yaml）
#
# 模型列表**不在这里**：STORE_MODEL_IN_DB=True，模型与 provider key 在 Admin UI
# （https://<域名>/ui，或 ssh -L 4000 后 http://127.0.0.1:4000/ui）里加，存 Postgres。
# 这样加/删模型、轮换上游 key 都不用提交仓库、不用重启。
#
# 只有需要「必须经仓库评审才生效」的全局设置才写进下面 general_settings。

model_list: []

general_settings:
  # 不写死 master_key / database_url：它们分别来自 LITELLM_MASTER_KEY 与
  # DATABASE_URL 环境变量（见 compose.yaml），避免密钥进仓库、避免两处漂移。

litellm_settings:
  # 请求日志保留完整上游错误，便于在 UI 的 Logs 里定位 401/429
  set_verbose: false
