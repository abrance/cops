# litellm 期望状态：自用 LLM 中转站（OpenAI 兼容网关 + Admin UI）
#
# 由 cops 部署流程在 cloud2（default 主机）/opt/cops/apps/litellm 下执行。
# 三件套：litellm（网关/UI）+ 它自己的 Postgres（模型、虚拟 key、花费日志）。
#
# 为什么不复用 dockpanel-postgres：cloud2 上已有的 dockpanel-postgres 属 Dockpanel
# 设备管理，跨项目共用库会把两边升级/备份缠在一起；这里用一个只有 litellm 用的小库，
# 数据在宿主机绝对路径 /opt/litellm/pgdata（勿删，删了等于丢所有虚拟 key）。
name: litellm

services:
  db:
    image: ${LITELLM_DB_IMAGE}:${LITELLM_DB_IMAGE_TAG}
    container_name: litellm-db
    restart: unless-stopped
    pull_policy: missing
    platform: linux/amd64
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:?LITELLM_DB_PASSWORD 必须来自 /opt/cops/secrets/litellm.env}
      POSTGRES_DB: litellm
    volumes:
      - /opt/litellm/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  litellm:
    image: ${LITELLM_IMAGE}:${LITELLM_IMAGE_TAG}
    container_name: litellm
    restart: unless-stopped
    # pull_policy=missing：deploy.sh 已显式 pull（带重试），always 会在 up -d 时再拉一次同 digest
    pull_policy: missing
    platform: linux/amd64
    depends_on:
      db:
        condition: service_healthy
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY 必须来自 /opt/cops/secrets/litellm.env}
      # SALT_KEY 加密库里存的 provider key；更换后已存 key 无法解密，只能重录
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?LITELLM_SALT_KEY 必须来自 /opt/cops/secrets/litellm.env}
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD}@db:5432/litellm
      # 模型在 Admin UI 里加（DB 存），config.yaml 只放骨架
      STORE_MODEL_IN_DB: "True"
      LITELLM_LOG: ${LITELLM_LOG:-INFO}
      TZ: ${TZ:-Asia/Shanghai}
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    volumes:
      # 只读挂载随仓库走的骨架配置
      - ./config.yaml:/app/config.yaml:ro
    ports:
      # 只监听回环：公网域名由宿主机 Traefik（dockpanel）反代，反代规则不在本仓库
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    healthcheck:
      # 镜像内没有 curl 的保障：litellm 镜像带 python，用 python 探活
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5).status==200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
