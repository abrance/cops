# litellm 单元元数据（cloud2 / default 主机，compose）
APP_NAME=litellm

# 网关容器健康检查走镜像自带 python 探 /health/liveliness；
# 首次启动要建表 + 迁移（约 20-40s），start_period 给 60s
HEALTH_CONTAINER=litellm
HEALTH_TIMEOUT=180
HEALTH_URL=http://127.0.0.1:4000/health/liveliness

# 运行期密钥：由 CI 从 GitHub Actions secret 下发，写入 cloud2
# /opt/cops/secrets/litellm.env（权限 600，不入库）
SECRET_ENV="LITELLM_MASTER_KEY LITELLM_SALT_KEY LITELLM_DB_PASSWORD"

# 三个缺一个都不能上线：缺 master key = 无鉴权的公网中转站；
# 缺 salt key = provider key 无法加解密；缺库口令 = 起不来
REQUIRED_ENV="LITELLM_MASTER_KEY LITELLM_SALT_KEY LITELLM_DB_PASSWORD"
