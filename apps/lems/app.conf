# 部署脚本读取的应用元数据
APP_NAME=lems

# 主服务容器与健康检查
HEALTH_CONTAINER=lems
HEALTH_TIMEOUT=180
HEALTH_URL=http://127.0.0.1:11000/api/health

# 运行期密钥：只有七牛 AK/SK 是敏感值，由 CI 下发到 /opt/cops/secrets/lems.env
# （该文件每次部署全量覆盖，必须列全本应用需要的密钥变量）
SECRET_ENV="QINIU_ACCESS_KEY QINIU_SECRET_KEY"
# 兜底校验：缺任一项时采集接口直接报「对象存储未配置」，不允许带空值上线。
# bucket/domain 来自同目录 .env（明文）。
REQUIRED_ENV="QINIU_ACCESS_KEY QINIU_SECRET_KEY QINIU_BUCKET QINIU_DOMAIN"
