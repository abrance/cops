# lems 期望状态：EMS 主服务 + ess_demo Modbus 从站
#
# 由 cops 部署流程在云主机 /opt/cops/apps/lems 下执行：
#   docker compose --env-file .env pull
#   docker compose --env-file .env up -d
#
# 镜像统一从 ghcr.chenby.cn 拉取；registry 凭据不写入仓库。
name: lems

services:
  lems:
    image: ${LEMS_IMAGE}:${LEMS_IMAGE_TAG}
    container_name: lems
    restart: unless-stopped
    pull_policy: always
    platform: linux/amd64
    depends_on:
      - emsdevice
    environment:
      APP_PROFILE: ${APP_PROFILE}
      # 容器时区：镜像内没有 tzdata，仅设 TZ 会被回落成 UTC；
      # 必须同时挂载宿主机 zoneinfo。否则 time.Now() 走 UTC，分时电价的
      # 峰/谷判定整体偏 8 小时（曾出现峰段按谷段充电）。
      TZ: ${TZ:-Asia/Shanghai}
      # 临时放开鉴权（见 .env 说明）：admin=读写全开，user=只读，留空=正常鉴权
      # 注意：compose 的 environment 是显式白名单，不写在这里容器就看不到该变量
      AUTH_BYPASS_ROLE: ${AUTH_BYPASS_ROLE:-}
      # 七牛云对象存储（现货日报图片）：明文变量来自 .env，密钥来自
      # /opt/cops/secrets/lems.env（deploy.sh 额外以 --env-file 加载）
      QINIU_ACCESS_KEY: ${QINIU_ACCESS_KEY:-}
      QINIU_SECRET_KEY: ${QINIU_SECRET_KEY:-}
      QINIU_BUCKET: ${QINIU_BUCKET:-}
      QINIU_DOMAIN: ${QINIU_DOMAIN:-}
      QINIU_ZONE: ${QINIU_ZONE:-z2}
      # OCR 服务（model-ocr 单元，已迁 cloud3 的 k3s）：走公网入口 https://ocr.xiaoyxq.top，
      # 证书由 Traefik 自动签发（历史同机方案走 cops-shared 网络直连，已废弃）
      OCR_BASE_URL: ${OCR_BASE_URL:-}
      OCR_TIMEOUT_SECONDS: ${OCR_TIMEOUT_SECONDS:-60}
    command:
      - ./ems
      - --web=true
      - --force=true
    ports:
      - "${LEMS_PORT}:80"
    volumes:
      - lems-data:/app/out
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    healthcheck:
      # 必须用 GET 探测：HEAD 请求会被路由拒绝，导致健康检查误报 unhealthy
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://localhost:80/api/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  emsdevice:
    image: ${EMSDEVICE_IMAGE}:${EMSDEVICE_IMAGE_TAG}
    container_name: emsdevice
    restart: unless-stopped
    pull_policy: always
    platform: linux/amd64
    command:
      - --listen
      - tcp://0.0.0.0:1502
      - --unit-id
      - "1"
    environment:
      EMSDEVICE_CONFIG: /etc/emsdevice/config.json
      # 容器时区：镜像内没有 tzdata，仅设 TZ 会被回落成 UTC；
      # 必须同时挂载宿主机 zoneinfo。否则 time.Now() 走 UTC，分时电价的
      # 峰/谷判定整体偏 8 小时（曾出现峰段按谷段充电）。
      TZ: ${TZ:-Asia/Shanghai}
      EMSDEVICE_MOCK: ${EMSDEVICE_MOCK}
      EMSDEVICE_MOCK_INTERVAL: ${EMSDEVICE_MOCK_INTERVAL}
      EMSDEVICE_MOCK_SOC: ${EMSDEVICE_MOCK_SOC}
      EMSDEVICE_MOCK_POWER: ${EMSDEVICE_MOCK_POWER}
    volumes:
      - ./emsdevice.json:/etc/emsdevice/config.json:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    ports:
      - "${EMSDEVICE_PORT}:1502"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  lems-data:
