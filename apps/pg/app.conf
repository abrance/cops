# 部署脚本读取的应用元数据
APP_NAME=pg

# cloud3 是 k3s 单机（docs/cloud3.md），走 k8s 模式；期望状态在 k8s.yaml。
DEPLOY_MODE=k8s
DEPLOY_TARGET=cloud3

K8S_NAMESPACE=pg
# 单副本 StatefulSet，用默认的 RollingUpdate 策略，可以直接等 rollout
# （openbao 那种 OnDelete 策略的单元不能这么做）。
K8S_ROLLOUT="statefulset/pg"

# 健康检查：**故意不设 K8S_HEALTH / PUBLIC_URL**，与 mysql8 同一个理由——
# deploy-k8s.sh 的探活是 curl 一个 HTTP 路径，Postgres 只说 PG 协议，写进来等于
# 每次部署都红。可用性由两点保证：rollout 等 Pod ready（readinessProbe 是
# pg_isready），以及调用方自己连不上 DB 就无法就绪。
#
# 也**没有**任何公网入口：不建 IngressRoute / IngressRouteTCP，只留
# ClusterIP pg.pg.svc:5432。旧 pg-test 实例曾用 Traefik 的 pg 入口暴露到
# 186.244.201.55:30630，闸门只有口令，现已被本单元取代。
HEALTH_TIMEOUT=300

# 运行期密钥：超级用户口令、应用角色口令、备份用的 MinIO 凭据。
# 前两个是本单元自有的新口令（新实例 = 新口令，旧 pg-test 的口令已进过会话记录）；
# MinIO 两个沿用 COMMON_ADMIN_USERNAME / COMMON_SIMPLE_PASSWORD，与 minio、mysql8
# 同一个值——有意复用，避免多份凭据漂移。
REQUIRED_ENV="POSTGRES_PASSWORD LLMBM_DB_PASSWORD MINIO_ROOT_USER MINIO_ROOT_PASSWORD"
SECRET_ENV="POSTGRES_PASSWORD LLMBM_DB_PASSWORD MINIO_ROOT_USER MINIO_ROOT_PASSWORD"
