# VictoriaMetrics cluster on cloud3; Kubernetes manifests are version-controlled here.
APP_NAME=victoria-metrics
DEPLOY_MODE=k8s
DEPLOY_TARGET=cloud3

K8S_NAMESPACE=victoria-metrics
K8S_ROLLOUT="deployment/vmcluster-victoria-metrics-cluster-vminsert deployment/vmcluster-victoria-metrics-cluster-vmselect statefulset/vmcluster-victoria-metrics-cluster-vmstorage"
K8S_HEALTH="vmcluster-victoria-metrics-cluster-vmselect:8481:/health"
HEALTH_TIMEOUT=600
SECRET_ENV=
