# model-agent 期望状态（k8s / k3s）
#
# 由 cops 部署流程执行：
#   CI 侧 scripts/render-k8s.py 把本文件里的占位符按同级 .env 与 app.conf 渲染成 rendered.yaml
#   → 同步到 cloud3 的 /opt/cops/apps/model-agent/
#   → scripts/deploy-k8s.sh 先按 app.conf 的 SECRET_ENV 建好 Secret，
#     再 kubectl apply + rollout + 探活
#
# 单元约定见仓库根 README 的「k8s 部署模式」；环境细节见 docs/cloud3.md。
#
# 这个单元的特点：**有状态**（组件目录、会话、物料都在 PVC 上），并且需要运行期密钥
# （provider api key 与入口密码），密钥不在这个文件里，由 deploy-k8s.sh 从主机上的
# 密钥文件生成 Secret 后注入。
apiVersion: v1
kind: Namespace
metadata:
  name: ${K8S_NAMESPACE}
---
# 80 → 443 跳转中间件：命名空间级对象，本单元与其它单元各写一份完全相同的，
# kubectl apply 幂等，这样不依赖单元部署顺序（全量部署不保证顺序）。
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: ${K8S_NAMESPACE}
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-agent
  namespace: ${K8S_NAMESPACE}
  labels:
    app: model-agent
spec:
  replicas: 1
  # 单副本 + 单份卷：默认的 RollingUpdate 会让新旧两个 Pod 同时读写同一个组件目录
  # （启动对账会把种子里一份拷进卷），用 Recreate 保证同一时刻只有一个进程。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: model-agent
  template:
    metadata:
      labels:
        app: model-agent
    spec:
      containers:
        - name: model-agent
          image: ${AGENT_IMAGE}:${AGENT_IMAGE_TAG}
          ports:
            - containerPort: ${AGENT_PORT}
          # 运行期密钥：provider api key 与入口密码。Secret 由 deploy-k8s.sh 按
          # app.conf 的 SECRET_ENV 从主机上的密钥文件生成；Secret 不存在时 Pod 会
          # 卡在 CreateContainerConfigError，所以脚本把它放在 kubectl apply 之前。
          envFrom:
            - secretRef:
                name: ${AGENT_SECRET_NAME}
          env:
            # 镜像自带的默认值是 30141，这里统一到集群惯用的端口
            - name: PORT
              value: "${AGENT_PORT}"
            # 走 Traefik 反代时必须显式信任对外域名，否则请求被判成不可信
            - name: PI_WEB_ALLOWED_HOSTS
              value: "${AGENT_ALLOWED_HOSTS}"
            - name: PI_WEB_IDLE_TIMEOUT_MS
              value: "${AGENT_IDLE_TIMEOUT_MS}"
          # 探 /readyz：它会去碰组件目录与启动对账留下的 manifest，缺一个就 503。
          # 用 /livez 会让「进程活着但基线没同步进卷」的部署判定成功。
          readinessProbe:
            httpGet:
              path: /readyz
              port: ${AGENT_PORT}
            # 首启要把出厂基线同步进卷（约 200 MB 的依赖文件）
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          # livenessProbe 探 /livez：它只表示进程活着，不碰组件目录——
          # 组件目录有问题时重启 Pod 修不好，那种情况交给 /readyz 把流量摘掉。
          livenessProbe:
            httpGet:
              path: /livez
              port: ${AGENT_PORT}
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: "${AGENT_CPU_LIMIT}"
              memory: ${AGENT_MEM_LIMIT}
          volumeMounts:
            # /data 下同时是组件目录、会话与物料（agent-home / overrides）
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: model-agent-data
---
# 组件目录（含基线装的依赖）、会话与物料。删 Pod、重建、回滚镜像都不会动它；
# 回滚镜像**不会**回滚这里的内容，见 modelman 的 docs/platform.md P1。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-agent-data
  namespace: ${K8S_NAMESPACE}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: ${AGENT_PVC_SIZE}
---
apiVersion: v1
kind: Service
metadata:
  name: model-agent
  namespace: ${K8S_NAMESPACE}
  labels:
    app: model-agent
spec:
  selector:
    app: model-agent
  ports:
    - name: http
      port: ${AGENT_PORT}
      targetPort: ${AGENT_PORT}
---
# 公网入口：必须拆成两条 IngressRoute。Traefik v3 里若把 [web, websecure] 与
# tls.certResolver 写在同一条上，只会生成 websecure 路由器：80 端口 404，
# 而且 ACME 的 HTTP-01 挑战同样 404（见 docs/cloud3.md 坑清单）。
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: model-agent
  namespace: ${K8S_NAMESPACE}
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`${PUBLIC_HOST}`)
      kind: Rule
      middlewares:
        - name: redirect-https
      services:
        - name: model-agent
          port: ${AGENT_PORT}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: model-agent-tls
  namespace: ${K8S_NAMESPACE}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`${PUBLIC_HOST}`)
      kind: Rule
      services:
        - name: model-agent
          port: ${AGENT_PORT}
  tls:
    certResolver: letsencrypt
