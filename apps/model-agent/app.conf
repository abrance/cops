# 部署脚本读取的应用元数据
APP_NAME=model-agent

# 部署模式与目标主机：cloud3 是 k3s 单机（见 docs/cloud3.md），走 k8s 模式。
# 期望状态在 k8s.yaml，由 CI 侧 scripts/render-k8s.py 按 .env 与 app.conf 渲染。
DEPLOY_MODE=k8s
DEPLOY_TARGET=cloud3

# 命名空间与工作负载
K8S_NAMESPACE=cops
K8S_ROLLOUT="deployment/model-agent"

# 健康检查：探 Service 的 ClusterIP（从主机直接可达，不需要进 Pod）。
# 探 /readyz 而不是 /livez：这个单元**有状态** —— 组件目录不可写或启动对账
# 没跑成时，进程还活着（/livez 200）但业务是坏的；只有 /readyz 会 503。
K8S_HEALTH="model-agent:8080:/readyz"
# 公网入口探活：证书签发需要几十秒，deploy-k8s.sh 会在这里重试。
# 用免登录的 /livez：它不碰组件目录，避免刚上线时把「卷还没同步好」当成入口不可用。
# 域名必须和 .env 的 PUBLIC_HOST（即 k8s.yaml 里 IngressRoute 的 Host）完全一致，
# 差一个字符就是 DNS 解析失败：这个 job 会红满 300 秒然后 exit 255，
# 而集群侧其实已经部署成功——红得没有信息量，真问题反而被埋掉。
PUBLIC_URL="https://ai.xiaoyxq.top/livez"
# 首次启动要把出厂基线同步进卷（约 200 MB 的依赖文件）+ 起 Next.js，给足时间。
HEALTH_TIMEOUT=300

# 运行期密钥：SECRET_ENV 负责下发（CI → 云主机 /opt/cops/secrets/model-agent.env），
# deploy-k8s.sh 据此把该文件变成 k8s Secret 并注入容器；REQUIRED_ENV 负责在服务器侧
# 兜底校验非空，避免带着空密钥上线（空密钥的表现是「能登录但一问就报 provider 错误」）。
#
# 两个变量的用途：
#   AGENT_PROVIDER_API_KEY —— 出厂基线里 provider 的 apiKey 只写引用，真值由它提供
#   PI_WEB_PASSWORD        —— 平台入口密码（单密码，见 docs/platform.md P9）
REQUIRED_ENV="AGENT_PROVIDER_API_KEY PI_WEB_PASSWORD"
SECRET_ENV="AGENT_PROVIDER_API_KEY PI_WEB_PASSWORD"
