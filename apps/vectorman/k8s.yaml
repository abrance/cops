# vectorman 期望状态（k8s / k3s）
#
# 由 cops 部署流程执行：
#   CI 侧 scripts/render-k8s.py 把占位符按同级 .env 与 app.conf 渲染成 rendered.yaml
#   → 同步到 cloud3 的 /opt/cops/apps/vectorman/
#   → scripts/deploy-k8s.sh 做 kubectl apply + rollout + 探活
#
# 单元约定见仓库根 README 的「k8s 部署模式」；环境细节见 docs/cloud3.md。
#
# 形态：三个 Deployment（单副本，strategy: Recreate）+ 各自 ConfigMap + Service
#       + 六条 IngressRoute。镜像是一个多功能镜像（web dist 已打进镜像），
#       三个容器只是入口命令不同。
#
# 为什么 Recreate 而不是 RollingUpdate：
#   sqlite（gse-server）、tsink + redb（dataserver）、apps.json（console）都是
#   单写者状态，滚动更新会让新旧两个 Pod 同时持有同一份状态文件。
#
# 为什么数据走 hostPath 而不是 PVC：
#   单节点 k3s，hostPath 最直接，也避免 PVC 迁移带来的二次搬迁。
#   多节点时改 PVC(local-path)，改动只在这里与 .env 的 HOSTPATH_* 变量。
apiVersion: v1
kind: Namespace
metadata:
  name: ${K8S_NAMESPACE}
---
# 80 → 443 跳转中间件：命名空间级对象，本单元与 model-logcluster / model-ocr
# 各写一份完全相同的，kubectl apply 幂等，这样不依赖单元部署顺序。
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: ${K8S_NAMESPACE}
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# ── gse-server（Agent RPC + GSE 控制台）───────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: gse-server-conf
  namespace: ${K8S_NAMESPACE}
data:
  gse-server.toml: |
    listen = "0.0.0.0:7100"
    auth_enabled = true
    heartbeat_interval_secs = 30
    heartbeat_timeout_secs = 90
    db = "data/gse-server.db"
    http_enabled = true
    http_listen = "0.0.0.0:7101"
    # 前端 dist 在镜像内 /app/web/gse（绝对路径，无需挂载）
    http_web_dir = "/app/web/gse"
    metrics_listen = "0.0.0.0:7102"
    dataplane_probe_interval_secs = 30
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gse-server
  namespace: ${K8S_NAMESPACE}
  labels:
    app: gse-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gse-server
  template:
    metadata:
      labels:
        app: gse-server
      # ConfigMap 内容的 sha256 由 deploy-k8s.sh 在 apply 后注入到这里
      # （见该脚本「checksum 注解」段）。规格：ConfigMap 改了但注解没变 → 不滚动；
      # 注解变了 → podTemplate 变 → Deployment 自动滚动新 Pod。不要手工加注解。
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: gse-server
          image: ${VECTORMAN_IMAGE}:${VECTORMAN_IMAGE_TAG}
          # tag 永不覆盖，所以 IfNotPresent 足够；改 tag 即换镜像。
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/gse-server"]
          workingDir: /app/gse-server
          env:
            - name: GSE_SERVER_CONFIG
              value: /app/gse-server/gse-server.toml
          ports:
            - name: rpc
              containerPort: 7100
            - name: http
              containerPort: 7101
          volumeMounts:
            - name: conf
              mountPath: /app/gse-server/gse-server.toml
              subPath: gse-server.toml
              readOnly: true
            - name: db
              mountPath: /app/gse-server/data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: ${CPU_REQUEST_GSE}
              memory: ${MEM_REQUEST_GSE}
            limits:
              memory: ${MEM_LIMIT_GSE}
      volumes:
        - name: conf
          configMap:
            name: gse-server-conf
        - name: db
          hostPath:
            path: ${HOSTPATH_GSE_SERVER}
            type: DirectoryOrCreate
---
# 双 Service 是刻意的：NodePort 给集群外的 Agent（域名:30710），
# ClusterIP 给集群内其他单元（dataserver 靠它反查台账）。
apiVersion: v1
kind: Service
metadata:
  name: gse-server
  namespace: ${K8S_NAMESPACE}
spec:
  type: NodePort
  selector:
    app: gse-server
  ports:
    - name: rpc
      port: 7100
      targetPort: rpc
      nodePort: ${NODEPORT_RPC}
    - name: http
      port: 7101
      targetPort: http
      nodePort: ${NODEPORT_GSE_HTTP}
---
apiVersion: v1
kind: Service
metadata:
  name: gse-server-internal
  namespace: ${K8S_NAMESPACE}
spec:
  type: ClusterIP
  selector:
    app: gse-server
  ports:
    - name: http
      port: 7101
      targetPort: http
---
# ── dataserver（数据面：SQL + Prom + 前端同源托管）────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: dataserver-conf
  namespace: ${K8S_NAMESPACE}
data:
  config.toml: |
    data_path = "/app/dataserver/data"
    ts_retention_days = 30
    ts_retention_enforced = true
    ts_clean_interval_secs = 3600
    apm_agg_interval_secs = 60
    apm_retention_days_default = 3
    apm_max_bytes = 0
    apm_clean_interval_secs = 3600
    apm_ingest_max_batches_per_sec = 0
    apm_min_duration_micros_for_detail = 0

    # 顶层键（不进任何 [段]！）：http_web_dir 同端口托管前端（镜像内 /app/web/dataplane）；
    # gse_admin_url 供台账联动（反查数据面注册）。
    # ⚠️ 这两行若误放进下面的 [sql_http] 段会**静默失效**（TOML 合法但服务不认）。
    http_web_dir = "/app/web/dataplane"
    gse_admin_url = "http://gse-server-internal.${K8S_NAMESPACE}.svc:7101"

    [sql_http]
    listen = "0.0.0.0:8081"

    [prom_http]
    listen = "0.0.0.0:9090"

    [metrics_http]
    listen = "0.0.0.0:9091"

    [auth]
    enabled = false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dataserver
  namespace: ${K8S_NAMESPACE}
  labels:
    app: dataserver
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dataserver
  template:
    metadata:
      labels:
        app: dataserver
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: dataserver
          image: ${VECTORMAN_IMAGE}:${VECTORMAN_IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/dataserver", "--config", "/app/dataserver/config.toml"]
          workingDir: /app/dataserver
          env:
            - name: DP_DATA_PATH
              value: /app/dataserver/data
          ports:
            - name: sql
              containerPort: 8081
            - name: prom
              containerPort: 9090
          volumeMounts:
            - name: conf
              mountPath: /app/dataserver/config.toml
              subPath: config.toml
              readOnly: true
            - name: data
              mountPath: /app/dataserver/data
          readinessProbe:
            httpGet:
              path: /health
              port: sql
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: sql
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: ${CPU_REQUEST_DATASERVER}
              memory: ${MEM_REQUEST_DATASERVER}
            limits:
              memory: ${MEM_LIMIT_DATASERVER}
      volumes:
        - name: conf
          configMap:
            name: dataserver-conf
        - name: data
          hostPath:
            path: ${HOSTPATH_DATASERVER}
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: dataserver
  namespace: ${K8S_NAMESPACE}
spec:
  type: NodePort
  selector:
    app: dataserver
  ports:
    - name: sql
      port: 8081
      targetPort: sql
      nodePort: ${NODEPORT_SQL}
    - name: prom
      port: 9090
      targetPort: prom
      nodePort: ${NODEPORT_PROM}
---
# ── console（桌面门户）───────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: console-conf
  namespace: ${K8S_NAMESPACE}
data:
  console.toml: |
    listen = "0.0.0.0:7200"
    web_dir = "/app/web/console"
    data_file = "apps.json"
    metrics_listen = "0.0.0.0:7201"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  namespace: ${K8S_NAMESPACE}
  labels:
    app: console
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: console
  template:
    metadata:
      labels:
        app: console
    spec:
      containers:
        - name: console
          image: ${VECTORMAN_IMAGE}:${VECTORMAN_IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/console"]
          workingDir: /app/console
          env:
            - name: CONSOLE_CONFIG
              value: /app/console/console.toml
          ports:
            - name: http
              containerPort: 7200
          volumeMounts:
            - name: conf
              mountPath: /app/console/console.toml
              subPath: console.toml
              readOnly: true
            - name: data
              mountPath: /app/console
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: ${CPU_REQUEST_CONSOLE}
              memory: ${MEM_REQUEST_CONSOLE}
            limits:
              memory: ${MEM_LIMIT_CONSOLE}
      volumes:
        - name: conf
          configMap:
            name: console-conf
        - name: data
          hostPath:
            path: ${HOSTPATH_CONSOLE}
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: console
  namespace: ${K8S_NAMESPACE}
spec:
  type: NodePort
  selector:
    app: console
  ports:
    - name: http
      port: 7200
      targetPort: http
      nodePort: ${NODEPORT_CONSOLE}
---
# ── 公网入口：六条 IngressRoute（每域名两条）──────────────────────────────────
#
# ⚠️ 必须拆成两条。Traefik v3 里若把 [web, websecure] 与 tls.certResolver 写在
#    同一条上，只会生成 websecure 路由器：80 端口 404，而且 ACME 的 HTTP-01
#    挑战同样 404（见 docs/cloud3.md 坑清单）。本仓库每个 k8s 单元都有这个坑。
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gse-server-web
  namespace: ${K8S_NAMESPACE}
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`${PUBLIC_HOST_GSE}`)
      kind: Rule
      middlewares:
        - name: redirect-https
      services:
        - name: gse-server
          port: 7101
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gse-server-tls
  namespace: ${K8S_NAMESPACE}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`${PUBLIC_HOST_GSE}`)
      kind: Rule
      services:
        - name: gse-server
          port: 7101
  tls:
    certResolver: letsencrypt
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dataserver-web
  namespace: ${K8S_NAMESPACE}
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`${PUBLIC_HOST_DATAPLANE}`)
      kind: Rule
      middlewares:
        - name: redirect-https
      services:
        - name: dataserver
          port: 8081
---
# 整域名全路径给同一个 Service：前端 dist 与 /v1/...、/api/v1/...、/assets/...
# 必须同源（同端口），否则前端的相对路径请求会打到错误的后端。
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dataserver-tls
  namespace: ${K8S_NAMESPACE}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`${PUBLIC_HOST_DATAPLANE}`)
      kind: Rule
      services:
        - name: dataserver
          port: 8081
  tls:
    certResolver: letsencrypt
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: console-web
  namespace: ${K8S_NAMESPACE}
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`${PUBLIC_HOST_CONSOLE}`)
      kind: Rule
      middlewares:
        - name: redirect-https
      services:
        - name: console
          port: 7200
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: console-tls
  namespace: ${K8S_NAMESPACE}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`${PUBLIC_HOST_CONSOLE}`)
      kind: Rule
      services:
        - name: console
          port: 7200
  tls:
    certResolver: letsencrypt
