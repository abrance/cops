# 部署脚本读取的应用元数据
APP_NAME=vectorman

# cloud3 是 k3s 单机（见 docs/cloud3.md），走 k8s 模式。
# 期望状态在 k8s.yaml，由 CI 侧 scripts/render-k8s.py 按 .env 渲染。
#
# 2026-09-26 从 native（cloud2 的 systemd 五件套）迁到 k8s（cloud3）。
# 旧 native 资产（native/deploy-native.sh、conf/*.toml）已删除：
# 配置改由 k8s.yaml 里的 ConfigMap 提供，二进制改由镜像提供。
DEPLOY_MODE=k8s
DEPLOY_TARGET=cloud3

# 命名空间与工作负载
K8S_NAMESPACE=vectorman
# 三个 Deployment 顺序等待（deploy-k8s.sh 是串行 rollout status）：
# gse-server 最轻（sqlite），dataserver 最重（tsink + redb），console 最轻。
# 顺序有讲究：dataserver 启动后会反查 gse-server 的台账（gse_admin_url 指向
# gse-server-internal:7101），所以 gse-server 必须先在。任何一个是全新镜像时，
# 三个加起来可能要 2-3 分钟（拉镜像 + 建库），故超时给 300s。
# 末尾的 DaemonSet 是每节点采集 Agent：它连公网域名:NodePort，不依赖上面三个，
# 放最后等（也让它的 ConfigMap checksum 走同一段逻辑）。
K8S_ROLLOUT="deployment/gse-server deployment/dataserver deployment/console daemonset/gse-agent"

# 健康检查：探 Service 的 ClusterIP（从主机直接可达，不需要进 Pod）。
# 探 gse-server 的 /health：它依赖 sqlite 可用，是三个里最能代表「整栈就绪」的。
K8S_HEALTH="gse-server:7101:/health"
# 公网入口探活：三个域名里挑 GSE 控制台（它是 Agent 接入面，最该先绿）。
# 证书签发需要几十秒，deploy-k8s.sh 会在这里重试。
PUBLIC_URL="https://vectorman.xiaoyxq.top/health"
# 同时控制 rollout 等待与探活总超时（scripts/deploy-k8s.sh 的 TIMEOUT）。
# dataserver 要打开 284MB 时序数据 + 校验 6500+ 段 + 回放 WAL，实测冷启动 ~5 分钟，
# 300s 会在 rollout 等待里被判失败（pod 其实还在正常启动）。
HEALTH_TIMEOUT=600

# 运行期密钥：gse-server 容器本身不需要密钥（token 写在 Agent 侧、服务端从台账读）；
# **gse-agent 需要**——它用 token 向 gse-server 注册，DaemonSet 从 Secret
# <APP_NAME>-secrets 的 GSE_AGENT_TOKEN 键注入。取值走既有的密钥管道：
#   GitHub Secrets → /opt/cops/secrets/vectorman.env → Secret vectorman-secrets → env。
# 同时声明在 REQUIRED_ENV：GitHub secret 没配时 CI 下发步骤直接失败，
# 主机的 secrets 文件缺键时部署也直接失败——不会静默上线一个拿空 token 的 Agent。
# （历史上 gse-agent-token 这个 Secret 是手工建的、值同样是 vm- 前缀的 token，
#   迁到本管道后它不再被引用，可删；agent_id 由 Downward API 取节点名。）
REQUIRED_ENV="GSE_AGENT_TOKEN"
SECRET_ENV="GSE_AGENT_TOKEN"
