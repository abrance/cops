APP_NAME=vectorman
# 非容器交付：发布包 + systemd，由 native/deploy-native.sh 自行完成部署
DEPLOY_MODE=native

# 健康探测（GET 真实 /health 路径）：gse-agent 仅 RPC、无 HTTP 健康端点。
# 多值必须整体加引号：app.conf 会被 shell 直接 source，裸空格会被当成命令。
HEALTH_URLS="http://127.0.0.1:7101/health http://127.0.0.1:7200/health http://127.0.0.1:8081/health http://127.0.0.1:9090/health"
HEALTH_TIMEOUT=180

# sudo 密码：云主机上 xiaoy 的 sudo 密码与 SSH 密码相同，故复用 DEPLOY_PASSWORD。
# 由 CI 写入 /opt/cops/secrets/vectorman.env（600），部署脚本读取后立即清除。
SECRET_ENV=VECTORMAN_SUDO_PASS
REQUIRED_ENV=VECTORMAN_SUDO_PASS
