# new-api 单元元数据（cloud2 / default 主机，compose）
APP_NAME=new-api

# 容器自带 wget 探 /api/status；首次启动要建表 + 初始化，给足 30s 预热与 180s 超时
HEALTH_CONTAINER=new-api
HEALTH_TIMEOUT=180
HEALTH_URL=http://127.0.0.1:4000/api/status

# 运行期密钥：由 CI 从 GitHub Actions secret 下发，写入 cloud2
# /opt/cops/secrets/new-api.env（权限 600，不入库）
#   SQL_DSN           postgresql://root:<POSTGRES_PASSWORD>@postgres:5432/new-api
#   POSTGRES_PASSWORD 主库 root 口令（与 SQL_DSN 里的口令同值，改一处必须改另一处）
#   REDIS_PASSWORD    Redis 口令（容器以 --requirepass 启动）
#   SESSION_SECRET    多实例会话共享密钥；单实例也设，避免换机后 cookie 突然全部失效
SECRET_ENV="SQL_DSN POSTGRES_PASSWORD REDIS_PASSWORD SESSION_SECRET"

# 四个缺一个都不能上线：缺主库口令 = 起不来或连不上库；缺 SQL_DSN = 落回 SQLite，
# 数据分散到容器卷里（换机即丢）；缺 Redis 口令 = 缓存无限流；缺 SESSION_SECRET = 登录态不可控
REQUIRED_ENV="SQL_DSN POSTGRES_PASSWORD REDIS_PASSWORD SESSION_SECRET"
