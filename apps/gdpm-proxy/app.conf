# gdpm-proxy 单元元数据
#
# 给 cloud3 的 lems 采集提供境内出口：源站 pm.gd.csg.cn 对境外来源 IP 不回包
# （cloud3 出口是美国 Colorado，TLS 握手能过但响应体永远 0 字节），cloud2 在上海直连正常。
#
# 健康检查靠容器内进程（没有 HTTP 接口）；部署后由 scripts/deploy.sh 的
# HEALTH_CONTAINER 等它 running。
APP_NAME=gdpm-proxy

HEALTH_CONTAINER=gdpm-proxy
HEALTH_TIMEOUT=60

# 不需要运行期密钥：白名单与端口是 compose.yaml 的 environment（随期望状态走）。
SECRET_ENV=""
