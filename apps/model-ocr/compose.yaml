# model-ocr 期望状态：PP-OCR 文字识别服务
#
# 由 cops 部署流程在云主机 /opt/cops/apps/model-ocr 下执行：
#   docker compose --env-file .env pull
#   docker compose --env-file .env up -d
#
# 镜像统一从 ghcr.chenby.cn 拉取；registry 凭据不写入仓库。
name: model-ocr

services:
  model-ocr:
    image: ${MODEL_OCR_IMAGE}:${MODEL_OCR_IMAGE_TAG}
    container_name: model-ocr
    restart: unless-stopped
    pull_policy: always
    platform: linux/amd64
    environment:
      # 服务默认不加鉴权。当前只绑回环地址，因此不需要 token；
      # 若要对外提供服务，先在 /opt/cops/secrets/model-ocr.env 写入 AUTH_TOKEN
      # 并在 app.conf 声明 SECRET_ENV，再把下面的端口绑定改掉。
      AUTH_TOKEN: ${AUTH_TOKEN:-}
      DEFAULT_MODEL: ${MODEL_OCR_DEFAULT_MODEL}
      PRELOAD_MODELS: ${MODEL_OCR_PRELOAD_MODELS}
      CONF_THRESHOLD: ${MODEL_OCR_CONF_THRESHOLD}
      MAX_CONCURRENCY: ${MODEL_OCR_MAX_CONCURRENCY}
      MAX_SIDE: ${MODEL_OCR_MAX_SIDE}
      # 限制推理线程数，避免与同机其它服务争抢 CPU
      OMP_NUM_THREADS: ${MODEL_OCR_OMP_NUM_THREADS}
      # 访问日志需要 tower_http=debug，级别写到 .env 便于随时调整
      RUST_LOG: ${MODEL_OCR_RUST_LOG}
    ports:
      # 只绑回环：对外访问交给同机反向代理，避免无鉴权接口被公网直接调用
      - "127.0.0.1:${MODEL_OCR_PORT}:8080"
    networks:
      - default
      # 跨单元互访：cops-shared 由 deploy.sh 按 app.conf 的 SHARED_NETWORKS 创建，
      # lems 等同网络容器可用 http://model-ocr:8080 直连，无需走宿主机回环或公网
      - shared
    deploy:
      resources:
        limits:
          cpus: "${MODEL_OCR_CPU_LIMIT}"
          memory: ${MODEL_OCR_MEM_LIMIT}
    healthcheck:
      # 用二进制自带的探测模式，镜像内不装 curl/wget
      test:
        - CMD
        - /app/ocr-service
        - --healthcheck
      interval: 30s
      timeout: 5s
      retries: 3
      # 首次启动要加载 MNN 模型，给足预热时间
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

networks:
  # 声明为 external：网络由 deploy.sh 统一创建，两个单元复用同一张网络。
  # 不用 compose 自己创建，是因为同名的外部网络带不同项目标签时 compose 会拒绝复用。
  shared:
    external: true
    name: cops-shared
