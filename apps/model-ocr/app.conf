# 部署脚本读取的应用元数据
APP_NAME=model-ocr

# 跨单元共享的 docker 网络：由 deploy.sh 确保存在，lems 等同网络容器
# 可用 http://model-ocr:8080 直连（本单元对外仍只绑回环）
SHARED_NETWORKS="cops-shared"

# 主服务容器与健康检查
HEALTH_CONTAINER=model-ocr
HEALTH_TIMEOUT=180
HEALTH_URL=http://127.0.0.1:9101/healthz

# 无必需变量：当前口径是不启用鉴权（modelman 仓库 docs/design.md D15），
# 服务只监听回环地址，由宿主机反代对外。
# 要启用时的做法：把 AUTH_TOKEN 同时写入 SECRET_ENV 与
# .github/workflows/deploy.yml 的密钥分发映射。
REQUIRED_ENV=""
SECRET_ENV=""
