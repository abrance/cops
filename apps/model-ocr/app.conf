# 部署脚本读取的应用元数据
APP_NAME=model-ocr

# 部署模式与目标主机：cloud3 是 k3s 单机（见 docs/cloud3.md），走 k8s 模式。
# 期望状态在 k8s.yaml，由 CI 侧 scripts/render-k8s.py 按 .env 与 app.conf 渲染。
DEPLOY_MODE=k8s
DEPLOY_TARGET=cloud3

# 命名空间与工作负载
K8S_NAMESPACE=cops
K8S_ROLLOUT="deployment/model-ocr"

# 健康检查：从主机 curl Service 的 ClusterIP 探活（k3s 的 kube-proxy 规则在
# 主机网络上，不需要进 Pod）。探针本身由 k8s 的 readinessProbe 执行。
K8S_HEALTH="model-ocr:8080:/healthz"
# 公网入口探活：证书签发需要几十秒，deploy-k8s.sh 会在这里重试
PUBLIC_URL="https://ocr.xiaoyxq.top/healthz"
HEALTH_TIMEOUT=180

# 无必需变量：当前口径是不启用鉴权（modelman 仓库 docs/design.md D15）。
# 启用方式：.env 里填 AUTH_TOKEN，这里声明 SECRET_ENV="AUTH_TOKEN"，
# 并在 .github/workflows/deploy.yml 的密钥分发映射里加一行。
REQUIRED_ENV=""
SECRET_ENV=""
