# 部署脚本读取的应用元数据
APP_NAME=llmbm

# cloud3 是 k3s 单机（docs/cloud3.md），走 k8s 模式；期望状态在 k8s.yaml。
DEPLOY_MODE=k8s
DEPLOY_TARGET=cloud3

K8S_NAMESPACE=cops
K8S_ROLLOUT="deployment/llmbm"

# 健康检查：主机 curl Service ClusterIP 探活。容器内探针由 k8s 自己执行。
K8S_HEALTH="llmbm:8787:/api/health"
# 公网入口探活（证书签发要几十秒，脚本会重试）
# 2026-11-13 起入口改为 llmbm.xiaoyxq.top；旧 sslip 地址的路由已移除（会 404，
# 探活会白等满 HEALTH_TIMEOUT 才判失败）。改域名时这里必须同步改。
PUBLIC_URL="https://llmbm.xiaoyxq.top/api/health"
HEALTH_TIMEOUT=300

REQUIRED_ENV="LLMBM_IMAGE LLMBM_IMAGE_TAG"
# 运行期密钥：v0.2 起只有一个 —— 结果库 DSN（LLMBM_PG_URL）。
#
# 它**不走** SECRET_ENV 这套 CI 下发管道：值由运维直接建在命名空间里
# （Secret `llmbm-pg`，key LLMBM_PG_URL，指向 apps/pg 单元的 ClusterIP 服务），
# k8s.yaml 用 secretKeyRef 引用它。所以这里保持 SECRET_ENV=""。
# 代价：重建集群 / 换命名空间时要先手工把 Secret 建回来，否则 Pod 卡在
# CreateContainerConfigError（fail-closed，不会静默回落 SQLite）。
#
# 模型 Key 仍然只存在浏览器 localStorage，服务端从不持久化
# （apps/web/src/lib/store.ts，服务端 /api/proxy 只做流式透传）。
SECRET_ENV=""
