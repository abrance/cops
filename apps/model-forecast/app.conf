# 部署脚本读取的应用元数据
APP_NAME=model-forecast

# 部署模式与目标主机：cloud3 是 k3s 单机（见 docs/cloud3.md），走 k8s 模式。
# 期望状态在 k8s.yaml，由 CI 侧 scripts/render-k8s.py 按 .env 渲染。
DEPLOY_MODE=k8s
DEPLOY_TARGET=cloud3

# 命名空间与工作负载
K8S_NAMESPACE=cops
K8S_ROLLOUT="deployment/model-forecast"

# 健康检查：探 Service 的 ClusterIP（从主机直接可达，不需要进 Pod）。
# 探 /readyz 而不是 /healthz：权重没常驻时进程仍在监听、/healthz 照样 200，
# 只有 /readyz 会 503；绑在 /healthz 上会漏掉"容器健康但业务端点全 503"。
K8S_HEALTH="model-forecast:8080:/readyz"
# 公网入口探活：证书签发需要几十秒，deploy-k8s.sh 会在这里重试
PUBLIC_URL="https://forecast.xiaoyxq.top/readyz"
# 给到 900 秒，不是在给模型加载留余量，而是在给**冷节点的首次拉镜像**留余量：
# deploy-k8s.sh 的 rollout 等待、集群探活、公网探活共用这一个 TIMEOUT，而
# rollout status 从 apply 那一刻就开始计时，镜像没拉完就一直显示
# "0 of 1 updated replicas are available"。实测 cloud3 从 ghcr.io 拉这个镜像
# 8.6 MB/s，2.5 GB ≈ 5 分钟，加上 sha256 校验 1.32 GB 权重与加载模型，
# 首次部署整条链路 6~7 分钟。首次用 300 秒时就是卡在这里超时（2026-09-30 实测）。
# 镜像已在节点上时（重新部署/回滚）runbook 秒级返回，这个值不会拖慢正常部署。
HEALTH_TIMEOUT=900

# 无必需变量：当前口径是不启用鉴权（modelman 仓库 docs/design.md D16）。
# 启用方式：.env 里填 AUTH_TOKEN，这里声明 SECRET_ENV="AUTH_TOKEN"，
# 并在 .github/workflows/deploy.yml 的密钥分发映射里加一行（k8s 单元还需把
# 它以 Secret 形式注入容器，见 README「k8s 部署模式」）。
REQUIRED_ENV=""
SECRET_ENV=""
