# 部署脚本读取的应用元数据
APP_NAME=vikunja

# 部署模式与目标主机：cloud3 是 k3s 单机（见 docs/cloud3.md），走 k8s 模式。
# 期望状态在 k8s.yaml，由 CI 侧 scripts/render-k8s.py 按 .env 与 app.conf 渲染。
DEPLOY_MODE=k8s
DEPLOY_TARGET=cloud3

# 命名空间：沿用迁移前手工部署的 vikunja，不搬数据、不改 Service 名，
# 于是 ConfigMap 里的连接串只差「DB 的命名空间」与「MinIO 的命名空间」两处。
K8S_NAMESPACE=vikunja
K8S_ROLLOUT="deployment/vikunja"

# 健康检查：探 /api/v1/info —— 免登录，且返回版本号，比探首页更硬。
# K8S_HEALTH 探 Service 的 ClusterIP（从主机直接可达）；
# PUBLIC_URL 再从公网探一次，入口证书与 Traefik 路由一并被验证。
K8S_HEALTH="vikunja:3456:/api/v1/info"
PUBLIC_URL="https://vikunja.xiaoyxq.top/api/v1/info"
HEALTH_TIMEOUT=180

# 运行期密钥：DB 口令、session 签名密钥、S3 的 AK/SK。
#   VIKUNJA_DATABASE_PASSWORD —— 与 environment/mysql8 的 root 口令同一个 GitHub secret
#                                （COMMON_SIMPLE_PASSWORD）；库与账号是 vikunja -> vikunja，
#                                口令在 docs/cloud3.md 的 MySQL 一节里随建号命令一起设定。
#   VIKUNJA_SERVICE_SECRET    —— 只用于签发 session/token；与上面同一个值（有意复用，
#                                少一个要轮换的凭据）。注意它变更后所有已登录 session 失效。
#   VIKUNJA_FILES_S3_*        —— 与 environment/minio 的 root 账号同值：MinIO 没有独立的
#                                子账号体系，附件读写用的就是 root 账号（见 docs/cloud3.md）。
REQUIRED_ENV="VIKUNJA_DATABASE_PASSWORD VIKUNJA_SERVICE_SECRET VIKUNJA_FILES_S3_ACCESSKEY VIKUNJA_FILES_S3_SECRETKEY"
SECRET_ENV="VIKUNJA_DATABASE_PASSWORD VIKUNJA_SERVICE_SECRET VIKUNJA_FILES_S3_ACCESSKEY VIKUNJA_FILES_S3_SECRETKEY"
