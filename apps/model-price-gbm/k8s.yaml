# model-price-gbm 期望状态（k8s / k3s）
#
# 由 cops 部署流程执行：
#   CI 侧 scripts/render-k8s.py 把本文件里的占位符按同级 .env 与 app.conf 渲染成 rendered.yaml
#   → 同步到 cloud3 的 /opt/cops/apps/model-price-gbm/
#   → scripts/deploy-k8s.sh 做 kubectl apply + rollout + 探活
#
# 单元约定见仓库根 README 的「k8s 部署模式」；环境细节见 docs/cloud3.md。
#
# 这个单元的形态：Deployment + Service，**没有 PVC、没有 IngressRoute**——
# 权重随镜像交付，服务无状态；调用方是同一集群里的 lems，ClusterIP 足够。
# 注意：render-k8s.py 不解析 YAML 结构，**注释里也不能出现字面量占位符**。
apiVersion: v1
kind: Namespace
metadata:
  name: ${K8S_NAMESPACE}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-price-gbm
  namespace: ${K8S_NAMESPACE}
  labels:
    app: model-price-gbm
spec:
  replicas: 1
  # 单副本 + 服务无状态：先删后建，避免滚动时两个 Pod 的 requests 叠加。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: model-price-gbm
  template:
    metadata:
      labels:
        app: model-price-gbm
    spec:
      containers:
        - name: model-price-gbm
          image: ${MODEL_PRICE_GBM_IMAGE}:${MODEL_PRICE_GBM_IMAGE_TAG}
          ports:
            - containerPort: ${MODEL_PRICE_GBM_PORT}
          # 环境变量全部用镜像内置默认（Dockerfile ENV）：MODELS_DIR=/app/models、
          # LISTEN_ADDR=0.0.0.0:8080、VERIFY_WEIGHTS=true（启动按 sha256.json 核对权重）、
          # MAX_DAYS=60、MAX_HORIZON_DAYS=14、MAX_BYTES=2097152。
          # 这些是 API 契约的一部分，不在这里重写，避免两处漂移；要调才加 env。
          # AUTH_TOKEN 不设 = 不鉴权（仅集群内可达）。
          readinessProbe:
            httpGet:
              path: /readyz
              port: ${MODEL_PRICE_GBM_PORT}
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: ${MODEL_PRICE_GBM_PORT}
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "${MODEL_PRICE_GBM_CPU_REQUEST}"
              memory: ${MODEL_PRICE_GBM_MEM_REQUEST}
            limits:
              cpu: "${MODEL_PRICE_GBM_CPU_LIMIT}"
              # LightGBM 加载后常驻几百 MB，smoke.sh 用 512m 跑通，1Gi 留一倍余量
              memory: ${MODEL_PRICE_GBM_MEM_LIMIT}
---
apiVersion: v1
kind: Service
metadata:
  name: model-price-gbm
  namespace: ${K8S_NAMESPACE}
  labels:
    app: model-price-gbm
spec:
  selector:
    app: model-price-gbm
  ports:
    - name: http
      port: ${MODEL_PRICE_GBM_PORT}
      targetPort: ${MODEL_PRICE_GBM_PORT}
