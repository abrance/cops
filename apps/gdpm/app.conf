# gdpm 单元元数据
#
# 官方披露接口（pm.gd.csg.cn）的日频采集，跑在 cloud3 的 k3s 上、按 CronJob 调度，
# 直接写 lems 的 sqlite（同一块 PVC）。数据链路说明见 ems 仓库 tools/gdpm/README.md。
APP_NAME=gdpm

DEPLOY_MODE=k8s
DEPLOY_TARGET=cloud3

K8S_NAMESPACE=cops
# CronJob 没有常驻 workload，apply 完就没有可等的对象；靠下一次运行的留痕看结果
# （gd_pm_fetch_run 每天一行 status=ok/failed，ems 页面能看到 failed）。
K8S_ROLLOUT=""

# 没有运行期密钥：出口代理地址与调度时点是明文期望状态（见 .env）。
REQUIRED_ENV=""
SECRET_ENV=""
