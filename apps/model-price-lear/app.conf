# 部署脚本读取的应用元数据
APP_NAME=model-price-lear

# 部署模式与目标主机：cloud3 是 k3s 单机（见 docs/cloud3.md），走 k8s 模式。
# 期望状态在 k8s.yaml，由 CI 侧 scripts/render-k8s.py 按 .env 渲染。
DEPLOY_MODE=k8s
DEPLOY_TARGET=cloud3

# 命名空间与工作负载
K8S_NAMESPACE=cops
K8S_ROLLOUT="deployment/model-price-lear"

# 健康检查：探 Service 的 ClusterIP（从主机直接可达，不需要进 Pod）。
# 探 /readyz 而不是 /healthz：权重没加载完时进程仍在监听、/healthz 照样 200，
# 只有 /readyz 会 503。
K8S_HEALTH="model-price-lear:8080:/readyz"

# 不开公网入口，因此没有 PUBLIC_URL。
# 600 秒：首次部署要拉镜像（约 300 MB），rollout 等待、集群探活共用这一个 TIMEOUT。
HEALTH_TIMEOUT=600

# 这个单元没有运行期密钥：权重随镜像交付，调用方与它同在集群内。
REQUIRED_ENV=""
SECRET_ENV=""
