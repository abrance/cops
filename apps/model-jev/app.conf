# 部署脚本读取的应用元数据
APP_NAME=model-jev

# 部署模式与目标主机：cloud3 是 k3s 单机（见 docs/cloud3.md），走 k8s 模式。
# 期望状态在 k8s.yaml，由 CI 侧 scripts/render-k8s.py 按 .env 渲染。
DEPLOY_MODE=k8s
DEPLOY_TARGET=cloud3

# 命名空间与工作负载
K8S_NAMESPACE=cops
K8S_ROLLOUT="deployment/model-jev"

# 健康检查：探 Service 的 ClusterIP（从主机直接可达，不需要进 Pod）。
# 探 /readyz 而不是 /healthz：权重没常驻时进程仍在监听、/healthz 照样 200，
# 只有 /readyz 会 503；绑在 /healthz 上会漏掉"容器健康但业务端点全 503"。
K8S_HEALTH="model-jev:8080:/readyz"
# 公网入口探活（无鉴权端点，不需要带 token）：证书签发需要几十秒，
# deploy-k8s.sh 会在这里重试
PUBLIC_URL="https://jev.xiaoyxq.top/readyz"
# 给到 900 秒，理由与 model-forecast 相同：deploy-k8s.sh 的 rollout 等待、集群探活、
# 公网探活共用这一个 TIMEOUT，而 rollout status 从 apply 那一刻就开始计时 ——
# 冷节点上镜像还没拉完（本镜像约 1.2 GB，含 torch 与 678 MB 权重）就一直显示
# "0 of 1 updated replicas are available"。首次用 300 秒会卡在这里超时。
# 镜像已在节点上时（重新部署/回滚）runbook 秒级返回，这个值不会拖慢正常部署。
HEALTH_TIMEOUT=900

# model-jev 的入口需要运行期密钥。容器侧读的是 AUTH_TOKEN，值来自 GitHub Secret
# MODEL_TOKEN（.github/workflows/deploy.yml 的「下发运行期密钥」里映射），
# CI 写到目标主机 /opt/cops/secrets/model-jev.env（权限 600，不入库），
# deploy-k8s.sh 再把它变成 k8s Secret 注入容器。要轮换 token 就改 GitHub Secret
# 并重新部署（内容变化会写进 podTemplate 注解触发滚动）。
# 取不到时部署应当失败而不是静默启动一个无鉴权的服务——所以它同时进 REQUIRED_ENV。
REQUIRED_ENV="AUTH_TOKEN"
SECRET_ENV="AUTH_TOKEN"
