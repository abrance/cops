# 部署脚本读取的应用元数据
APP_NAME=openbao

# 部署模式与目标主机：cloud3（k3s 单机），走 k8s 流程。
DEPLOY_MODE=k8s
DEPLOY_TARGET=cloud3

# 命名空间与工作负载：helm chart 的 StatefulSet 名 = release 名 = openbao。
# 故意不设 K8S_ROLLOUT：chart 默认 updateStrategyType=OnDelete，而
# `kubectl rollout status` 只支持 RollingUpdate 策略，设了反而每次部署都红。
# 可用性由下面的 K8S_HEALTH / PUBLIC_URL 兜底（它们探真实 API，比 rollout 更硬)。
# 有意保留 OnDelete：密钥服务重启应当是刻意的（任何重启后都要人工重新 unseal），
# 不让 CI 的 podTemplate 变化自动重启它。
K8S_NAMESPACE=openbao

# helm chart 声明：CI 侧用它 helm template 渲染 chart（见 deploy.yml 的渲染步骤）。
# 升级 chart 改这里 + 更新 values.yaml 即可，不需要手改渲染产物。
# chart 0.30.2 要求 K8s >= 1.30 / Helm >= 3.12（cloud3 是 v1.37.0 / v3.22.0，满足）。
HELM_CHART=openbao/openbao
HELM_CHART_VERSION=0.30.2
HELM_CHART_REPO=https://openbao.github.io/openbao-helm

# 健康检查：探 Service 的 ClusterIP（从主机直接可达）。
# 探 /v1/sys/seal-status 而不是 /v1/sys/health：sealed / unsealed 都返回 200，
# 只验证 API 活着。init + unseal 是**人工一次性动作**（产物 root token + unseal
# keys 存主机 /opt/cops/secrets/openbao.env），CI 不等待它 —— 见 values.yaml 里
# readinessProbe.enabled=false 的原因。
K8S_HEALTH="openbao:8200:/v1/sys/seal-status"
# 公网入口探活：证书签发需要几十秒，deploy-k8s.sh 会在这里重试。同样探
# seal-status——刚上线还没 init 时 /v1/sys/health 会 503，会让首次部署误红。
PUBLIC_URL="https://bao.xiaoyxq.top/v1/sys/seal-status"
# 首次部署要拉镜像（quay.io 约 100MB）+ Traefik 签证书，给足时间。
HEALTH_TIMEOUT=300

# 运行期密钥与 Secret 注入：本单元**不需要**（OpenBao 不读 k8s Secret 配运行参数，
# 密钥管理走自己的 seal/unseal 体系）。init 出的 root token 与 unseal keys 由
# 人工保管，见 docs/cloud3.md。
SECRET_ENV=