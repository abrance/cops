# 部署脚本读取的应用元数据
APP_NAME=model-logcluster

# 跨单元共享的 docker 网络：由 deploy.sh 确保存在，同网络容器
# 可用 http://model-logcluster:8080 直连（本单元对外仍只绑回环）
SHARED_NETWORKS="cops-shared"

# 主服务容器与健康检查
HEALTH_CONTAINER=model-logcluster
HEALTH_TIMEOUT=180
# 探 /readyz 而不是 /healthz：这个服务**有状态**，状态文件不可用时
# /healthz 仍返回 200，只有 /readyz 会 503。用 /healthz 会让部署在
# "容器健康但业务端点全 503" 的情况下判定成功。
HEALTH_URL=http://127.0.0.1:9103/readyz

# 无必需变量：服务默认不启用鉴权，且只监听回环地址。
# 若将来对外开放，把 AUTH_TOKEN 同时写入 SECRET_ENV 与
# .github/workflows/deploy.yml 的密钥分发映射。
REQUIRED_ENV=""
SECRET_ENV=""
