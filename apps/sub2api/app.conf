# sub2api 单元元数据（cloud2 / default 主机，compose）
APP_NAME=sub2api

# 容器自带 wget 探 /health；首次启动要建库表 + 迁移，start_period 给 120s
HEALTH_CONTAINER=sub2api
HEALTH_TIMEOUT=300
HEALTH_URL=http://127.0.0.1:8080/health

# 运行期密钥：由 CI 从 GitHub Actions secret 下发，写入 cloud2
# /opt/cops/secrets/sub2api.env（权限 600，不入库）。
# 注意：SECRET_ENV 里的名字是「容器侧变量名」，deploy.yml 里映射的 GitHub secret
# 名带 SUB2API_ 前缀（POSTGRES_PASSWORD 在本 workflow 的 env 块已被 pg 单元占用）。
#   POSTGRES_PASSWORD   <- secrets.SUB2API_DB_PASSWORD
#   REDIS_PASSWORD      <- secrets.SUB2API_REDIS_PASSWORD
#   JWT_SECRET          <- secrets.SUB2API_JWT_SECRET
#   TOTP_ENCRYPTION_KEY <- secrets.SUB2API_TOTP_ENCRYPTION_KEY
#   ADMIN_PASSWORD      <- secrets.SUB2API_ADMIN_PASSWORD
SECRET_ENV="POSTGRES_PASSWORD REDIS_PASSWORD JWT_SECRET TOTP_ENCRYPTION_KEY ADMIN_PASSWORD"

# 五个缺一个都不能上线：缺库口令=起不来；缺 JWT=重启掉线；缺 TOTP=2FA 失效；
# 缺管理员密码=首次启动随机生成（能起但登录不上，等于白部署）
REQUIRED_ENV="POSTGRES_PASSWORD REDIS_PASSWORD JWT_SECRET TOTP_ENCRYPTION_KEY ADMIN_PASSWORD"
