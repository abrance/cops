# 部署脚本读取的应用元数据
APP_NAME=ptdoc

# 主服务容器与健康检查
HEALTH_CONTAINER=ptdoc
HEALTH_TIMEOUT=120
HEALTH_URL=http://127.0.0.1:4173/

# 运行期密钥：由 CI 从 GitHub Actions secret 下发，写入云主机
# /opt/cops/secrets/ptdoc.env（权限 600，不入库）
SECRET_ENV=PTDOC_DATA_KEY

# 运行期必需变量：deploy.sh 启动前检查非空，避免带着空密钥上线后
# 七牛功能静默失效（静态站根路径仍返回 200，健康检查察觉不到）
REQUIRED_ENV=PTDOC_DATA_KEY
