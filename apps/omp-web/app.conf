# 部署脚本读取的应用元数据
APP_NAME=omp-web

# 部署模式与目标主机：cloud3 是 k3s 单机（见 docs/cloud3.md），走 k8s 模式。
# 期望状态在 k8s.yaml，由 CI 侧 scripts/render-k8s.py 按 .env 与 app.conf 渲染。
DEPLOY_MODE=k8s
DEPLOY_TARGET=cloud3

# 命名空间与工作负载
K8S_NAMESPACE=cops
K8S_ROLLOUT="deployment/omp-web"

# 健康检查：探 Service 的 ClusterIP（从主机直接可达，不需要进 Pod）。
# 探 /manifest.webmanifest 而不是 / 或 /api/*：omp-web 的鉴权中间件只覆盖
# /、/recover、/api/:path*，静态资源未登录也 200 —— 拿未登录会 401 的路径做探针
# 会让 Pod 永远不 ready（实测过，见 modelman 的 docs/omp-instance.md）。
K8S_HEALTH="omp-web:8080:/manifest.webmanifest"
# 公网入口探活：证书签发需要几十秒，deploy-k8s.sh 会在这里重试。
PUBLIC_URL="https://omp.xiaoyxq.top/manifest.webmanifest"
# 首次启动要拉 3 GB 级的镜像 + 把出厂基线同步进卷，给足时间。
HEALTH_TIMEOUT=300

# 运行期密钥：SECRET_ENV 负责下发（CI → 云主机 /opt/cops/secrets/omp-web.env），
# deploy-k8s.sh 据此把该文件变成 k8s Secret 并注入容器；REQUIRED_ENV 负责在服务器侧
# 兜底校验非空，避免带着空密钥上线。
#
# 两个变量的用途：
#   AGENT_PROVIDER_API_KEY —— 出厂基线里 provider 的 apiKey 只写引用，真值由它提供
#                             （与主工作台共用同一个值）
#   OMP_WEB_PASSWORD       —— 入口密码（与主工作台同一个值，见 docs/omp-instance.md）
REQUIRED_ENV="AGENT_PROVIDER_API_KEY OMP_WEB_PASSWORD"
SECRET_ENV="AGENT_PROVIDER_API_KEY OMP_WEB_PASSWORD"
