# omp-web 期望状态（k8s / k3s）—— 第二个工作台（omp 实例）
#
# 由 cops 部署流程执行：
#   CI 侧 scripts/render-k8s.py 把本文件里的占位符按同级 .env 与 app.conf 渲染成 rendered.yaml
#   → 同步到 cloud3 的 /opt/cops/apps/omp-web/
#   → scripts/deploy-k8s.sh 先按 app.conf 的 SECRET_ENV 建好 Secret，
#     再 kubectl apply + rollout + 探活
#
# 单元约定见仓库根 README 的「k8s 部署模式」；环境细节见 docs/cloud3.md；
# 这个实例的形态与实测证据见 modelman 仓库的 docs/omp-instance.md。
#
# 与 model-agent 的差别：进程是 omp-web（内含 omp 自己的 SDK，跑在 Bun 上），
# 探针走静态资源（鉴权中间件会拦 / 与 /api/*），env 用 OMP_WEB_* 前缀。
apiVersion: v1
kind: Namespace
metadata:
  name: ${K8S_NAMESPACE}
---
# 80 → 443 跳转中间件：命名空间级对象，本单元与其它单元各写一份完全相同的，
# kubectl apply 幂等，这样不依赖单元部署顺序（全量部署不保证顺序）。
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: ${K8S_NAMESPACE}
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omp-web
  namespace: ${K8S_NAMESPACE}
  labels:
    app: omp-web
spec:
  replicas: 1
  # 单副本 + 单份卷：默认的 RollingUpdate 会让新旧两个 Pod 同时读写同一个 agent 目录
  # （启动对账会把种子里一份拷进卷），用 Recreate 保证同一时刻只有一个进程。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: omp-web
  template:
    metadata:
      labels:
        app: omp-web
    spec:
      containers:
        - name: omp-web
          image: ${AGENT_IMAGE}:${AGENT_IMAGE_TAG}
          ports:
            - containerPort: ${AGENT_PORT}
          # 运行期密钥：provider api key 与入口密码。Secret 由 deploy-k8s.sh 按
          # app.conf 的 SECRET_ENV 从主机上的密钥文件生成；Secret 不存在时 Pod 会
          # 卡在 CreateContainerConfigError，所以脚本把它放在 kubectl apply 之前。
          envFrom:
            - secretRef:
                name: ${AGENT_SECRET_NAME}
          env:
            # 镜像自带的默认值是 30141，这里统一到集群惯用的端口
            - name: PORT
              value: "${AGENT_PORT}"
            # 走 Traefik 反代时必须显式信任对外域名，否则非 loopback 的 Host 会被 403
            - name: OMP_WEB_ALLOWED_HOSTS
              value: "${AGENT_ALLOWED_HOSTS}"
          # 探 /manifest.webmanifest：静态资源，不经过鉴权中间件（它只覆盖 /、
          # /recover、/api/:path*），未登录也 200。用 / 或 /api/* 会让 Pod 永远不 ready。
          readinessProbe:
            httpGet:
              path: /manifest.webmanifest
              port: ${AGENT_PORT}
            # 首启要拉镜像 + 对账（种子很小，主要是镜像拉取时间）
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          # livenessProbe 也探静态资源：进程活着就通过。业务层面的坏（模型注册表起不来）
          # 不靠重启修，重启 Pod 也修不好；这里只判断进程是否还能应答。
          livenessProbe:
            httpGet:
              path: /manifest.webmanifest
              port: ${AGENT_PORT}
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: "${AGENT_CPU_LIMIT}"
              memory: ${AGENT_MEM_LIMIT}
          volumeMounts:
            # /data 下同时是 agent 目录（agent-home）、HOME 与工作目录
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: omp-web-data
---
# agent 目录（session、agent.db、models.db）、HOME 与工作目录。
# 删 Pod、重建、回滚镜像都不会动它；回滚镜像**不会**回滚这里的内容。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: omp-web-data
  namespace: ${K8S_NAMESPACE}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: ${AGENT_PVC_SIZE}
---
apiVersion: v1
kind: Service
metadata:
  name: omp-web
  namespace: ${K8S_NAMESPACE}
  labels:
    app: omp-web
spec:
  selector:
    app: omp-web
  ports:
    - name: http
      port: ${AGENT_PORT}
      targetPort: ${AGENT_PORT}
---
# 公网入口：必须拆成两条 IngressRoute。Traefik v3 里若把 [web, websecure] 与
# tls.certResolver 写在同一条上，只会生成 websecure 路由器：80 端口 404，
# 而且 ACME 的 HTTP-01 挑战同样 404（见 docs/cloud3.md 坑清单）。
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: omp-web
  namespace: ${K8S_NAMESPACE}
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`${PUBLIC_HOST}`)
      kind: Rule
      middlewares:
        - name: redirect-https
      services:
        - name: omp-web
          port: ${AGENT_PORT}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: omp-web-tls
  namespace: ${K8S_NAMESPACE}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`${PUBLIC_HOST}`)
      kind: Rule
      services:
        - name: omp-web
          port: ${AGENT_PORT}
  tls:
    certResolver: letsencrypt
