            { "addr": "0x1A4", "key": "ReverseActiveEnergy", "name": "反向有功电量", "type": "uint16", "scale": 0.01, "value": 300 },
            { "addr": "0x1A5", "key": "Frequency", "name": "频率", "type": "int16", "scale": 0.01, "value": 50 },
            { "addr": "0x1A6", "key": "PowerFactor", "name": "功率因数", "type": "int16", "scale": 0.001, "value": 0.96 },
