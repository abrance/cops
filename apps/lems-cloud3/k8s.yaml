apiVersion: apps/v1
kind: Deployment
metadata:
  name: emsdevice
  namespace: ${K8S_NAMESPACE}
  labels:
    app: emsdevice
spec:
  replicas: 1
  # 单副本 + 无持久化：模拟从站可随时重建，Recreate 避免新旧两个从站同时在
  # 集群里对同一 unitId 提供寄存器（lems 只会连到 Service 选中的那一个）。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: emsdevice
  template:
    metadata:
      labels:
        app: emsdevice
    spec:
      containers:
        - name: emsdevice
          image: ${EMSDEVICE_IMAGE}:${EMSDEVICE_IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          args:
            - --listen
            - tcp://0.0.0.0:${EMSDEVICE_PORT}
            - --unit-id
            - "1"
          ports:
            - name: modbus
              containerPort: ${EMSDEVICE_PORT}
              protocol: TCP
          env:
            - name: EMSDEVICE_CONFIG
              value: /etc/emsdevice/config.json
            - name: EMSDEVICE_MOCK
              value: "${EMSDEVICE_MOCK}"
            - name: EMSDEVICE_MOCK_INTERVAL
              value: "${EMSDEVICE_MOCK_INTERVAL}"
            - name: EMSDEVICE_MOCK_SOC
              value: "${EMSDEVICE_MOCK_SOC}"
            - name: EMSDEVICE_MOCK_POWER
              value: "${EMSDEVICE_MOCK_POWER}"
          # Modbus TCP 从站没有 HTTP 端点，探活只能走 TCP 连接
          readinessProbe:
            tcpSocket:
              port: modbus
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: modbus
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/emsdevice
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: emsdevice-config
---
apiVersion: v1
kind: Service
metadata:
  # 名字必须是 emsdevice：lems 里的设备协议地址是 emsdevice:1502，靠同命名空间
  # 的 Service DNS 解析到从站
  name: emsdevice
  namespace: ${K8S_NAMESPACE}
  labels:
    app: emsdevice
spec:
  type: ClusterIP
  selector:
    app: emsdevice
  ports:
    - name: modbus
      port: ${EMSDEVICE_PORT}
      targetPort: modbus
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: lems
  namespace: ${K8S_NAMESPACE}
  labels:
    app: lems
spec:
  type: ClusterIP
  selector:
    app: lems
  ports:
    - name: http
      port: ${LEMS_PORT}
      targetPort: http
      protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lems-cloud3-redirect-https
  namespace: ${K8S_NAMESPACE}
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lems-cloud3-web
  namespace: ${K8S_NAMESPACE}
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`${PUBLIC_HOST}`)
      kind: Rule
      middlewares:
        - name: lems-cloud3-redirect-https
      services:
        - name: lems
          port: ${LEMS_PORT}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lems-cloud3-tls
  namespace: ${K8S_NAMESPACE}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`${PUBLIC_HOST}`)
      kind: Rule
      services:
        - name: lems
          port: ${LEMS_PORT}
  tls:
    certResolver: letsencrypt
