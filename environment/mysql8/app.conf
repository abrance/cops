# 部署脚本读取的应用元数据
APP_NAME=mysql8

# 部署模式与目标主机：cloud3 是 k3s 单机（见 docs/cloud3.md），走 k8s 模式。
# 期望状态在 k8s.yaml，由 CI 侧 scripts/render-k8s.py 按 .env 与 app.conf 渲染。
DEPLOY_MODE=k8s
DEPLOY_TARGET=cloud3

# 命名空间与工作负载：本单元是**通用** MySQL 8（不属于任何单个应用），所以给
# 自己一个命名空间。应用按库/账号隔离，而不是按实例隔离：新增一个应用只需在
# 这里 CREATE DATABASE / CREATE USER，不必再起一个单元。
K8S_NAMESPACE=mysql8
# 只有一个工作负载，且用的是 StatefulSet 默认的 RollingUpdate 策略，
# 所以可以直接等 rollout（openbao 那种 OnDelete 策略的单元不能这么做）。
K8S_ROLLOUT="statefulset/mysql"

# 健康检查：**故意不设 K8S_HEALTH / PUBLIC_URL**。
# deploy-k8s.sh 的探活是 curl 一个 HTTP 路径，而 MySQL 只说 MySQL 协议，
# 3306 上 curl 必然失败——写进来等于每次部署都红。可用性由两点保证：
#   1. K8S_ROLLOUT 等 StatefulSet 就绪（Pod 的 readinessProbe 是 mysqladmin ping）；
#   2. 调用方（apps/vikunja）自己的探针，它连不上 DB 就无法就绪。
# 这也符合仓库约定：不要为了让探活好看而加一个恒 200 的假接口。

# 运行期密钥：**只有 root 口令**。本单元不注入 MYSQL_DATABASE / MYSQL_USER，
# 也就没有「镜像首次初始化时顺手建库建号」的行为——那是把具体应用写死进通用组件，
# 而且只在空 datadir 首启生效，反而更难排查。库与账号由使用方按需创建（见
# docs/cloud3.md 的 MySQL 一节里 vikunja 的建库建号命令）。
#
# 口令值与 minio 的 root 口令、apps/vikunja 的 S3 AK/SK 相同：这是**有意复用同一个
# GitHub secret**（COMMON_SIMPLE_PASSWORD），避免多份口令漂移；代价是同一个值覆盖
# 多个组件，泄露面更大（见 docs/cloud3.md 的凭据一节）。
REQUIRED_ENV="MYSQL_ROOT_PASSWORD"
SECRET_ENV="MYSQL_ROOT_PASSWORD"

# 首次部署要在空的 hostPath 上初始化 datadir（比拉镜像慢），给足时间。
HEALTH_TIMEOUT=300
