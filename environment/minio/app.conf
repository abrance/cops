# 部署脚本读取的应用元数据
APP_NAME=minio

# 部署模式与目标主机：cloud3 是 k3s 单机（见 docs/cloud3.md），走 k8s 模式。
# 期望状态在 k8s.yaml，由 CI 侧 scripts/render-k8s.py 按 .env 与 app.conf 渲染。
DEPLOY_MODE=k8s
DEPLOY_TARGET=cloud3

# 命名空间：迁移前跑在手工建的 minio-test（PVC data-minio-0 + 两条手工 IngressRoute），
# 纳入仓库时改为 minio，与其它单元「一个单元一个命名空间」一致；数据同时从 PVC 迁到
# 宿主机 hostPath，搬迁步骤见 docs/cloud3.md 的 MinIO 一节。
K8S_NAMESPACE=minio
K8S_ROLLOUT="statefulset/minio"

# 健康检查：探 /minio/health/live —— 免认证、不依赖任何 bucket，只验证进程活着。
# K8S_HEALTH 探 Service 的 ClusterIP（从主机直接可达）；PUBLIC_URL 再从公网探一次
# （入口是 sslip.io + Traefik ACME 签的 Let's Encrypt 证书，证书续期也一并被验证）。
K8S_HEALTH="minio:9000:/minio/health/live"
PUBLIC_URL="https://minio.186.244.201.55.sslip.io/minio/health/live"
# 首次部署要拉镜像（bitnamilegacy/minio 约 130 MB）并签证书，给足时间。
HEALTH_TIMEOUT=300

# 运行期密钥：MinIO 的 root 账号。
#   用户名取自仓库 variable COMMON_ADMIN_USERNAME（值 xiaoy，是 variable 不是 secret，
#   与迁移前 minio-secret 里的 MINIO_ROOT_USER 相同，所以搬迁后凭据语义不变）
#   口令取自 secret COMMON_SIMPLE_PASSWORD
# 注意口令是**有意在多个组件间复用同一个值**的：同一个值同时是 vikunja 的 S3 AK/SK
# 与 mysql8 的口令，改一处两边同步变，避免 MinIO 与 vikunja 侧凭据漂移导致的附件 403。
# 代价是同一个口令覆盖多个组件，泄露面更大；cloud3 是该账号的唯一来源。
REQUIRED_ENV="MINIO_ROOT_USER MINIO_ROOT_PASSWORD"
SECRET_ENV="MINIO_ROOT_USER MINIO_ROOT_PASSWORD"
