# 部署脚本读取的环境组件元数据
APP_NAME=ptdoc-qdrant

# 主服务容器与健康检查
# gateway 镜像只有一个二进制、自带 /healthz，但镜像内没有 curl/wget 可做
# compose healthcheck，因此 HEALTH_CONTAINER 只用于等待容器进入 running，
# 真正的可用性判定交给 HEALTH_URL。
HEALTH_CONTAINER=ptdoc-qdrant-gateway
HEALTH_TIMEOUT=180
HEALTH_URL=http://127.0.0.1:6335/healthz

# 无运行期密钥：不需要 SECRET_ENV / REQUIRED_ENV
